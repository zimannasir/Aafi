<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aafi and Aara Steps — Daily Practice</title>
<style>
  :root{
    --bg:#f4f7fb; --card:#ffffff; --ink:#1f2a44; --muted:#6b7690;
    --brand:#4f6df5; --brand-dark:#3a52d6; --good:#1faa6c; --good-bg:#e6f7ef;
    --bad:#e0485a; --bad-bg:#fdecee; --warn:#f0a500;
    --maths:#4f6df5; --english:#f0663a; --reading:#16a34a; --line:#e6eaf2; --shadow:0 10px 30px rgba(31,42,68,.08);
    --r:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;line-height:1.45}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 80px}
  .hidden{display:none!important}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:14px;font-weight:700}
  .btn{background:var(--brand);color:#fff;padding:14px 20px;font-size:16px;box-shadow:0 6px 16px rgba(79,109,245,.28);transition:transform .06s ease, filter .2s}
  .btn:hover{filter:brightness(1.05)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:#eef1f8;color:var(--ink);box-shadow:none}
  .btn.danger{background:var(--bad);box-shadow:none}
  .btn.danger.soft{background:var(--bad-bg);color:var(--bad)}
  .btn.big{width:100%;padding:18px;font-size:18px;border-radius:16px}
  .btn.wide{width:100%}
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;margin-bottom:16px;border:1px solid var(--line)}
  h1{font-size:26px;margin:0 0 4px}
  h2{font-size:20px;margin:0 0 10px}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .row{display:flex;gap:12px;align-items:center}
  .row.wrap{flex-wrap:wrap}
  .spread{display:flex;justify-content:space-between;align-items:center;gap:10px}

  /* header */
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;cursor:pointer;user-select:none}
  .homebtn{background:#eef1f8;color:var(--ink);font-weight:800;padding:8px 12px;border-radius:12px;font-size:14px;border:1px solid var(--line)}
  .homebtn:hover{background:#e2e8f7}
  .logo .dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#7d63f0);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
  .streak{background:#fff4e0;color:#a86b00;font-weight:800;padding:8px 12px;border-radius:12px;font-size:14px;border:1px solid #ffe6bf}

  /* subject cards */
  .subject{border-radius:var(--r);padding:20px;color:#fff;position:relative;overflow:hidden}
  .subject.maths{background:linear-gradient(135deg,#4f6df5,#6b8bff)}
  .subject.english{background:linear-gradient(135deg,#f0663a,#ff8a5c)}
  .subject.reading{background:linear-gradient(135deg,#16a34a,#4ade80)}
  .subject h2{color:#fff}
  .subject .lvl{opacity:.92;font-size:14px;margin-bottom:14px}
  .progress{height:10px;background:rgba(255,255,255,.35);border-radius:999px;overflow:hidden;margin:10px 0 16px}
  .progress > i{display:block;height:100%;background:#fff;border-radius:999px;transition:width .5s}
  .subject .btn{background:#fff}
  .subject.maths .btn{color:var(--brand-dark)}
  .subject.english .btn{color:#c2451f}
  .subject.reading .btn{color:#15803d}
  .done-tag{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.25);padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700}

  /* practice */
  .qbar{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .qcount{font-weight:800;color:var(--muted)}
  .bar{flex:1;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--brand);transition:width .3s}
  .stage{font-size:13px;font-weight:700}
  .stage.correcting{color:var(--bad)}
  .question{font-size:30px;font-weight:800;text-align:center;margin:26px 0 8px;line-height:1.3}
  .qhint{text-align:center;color:var(--muted);margin-bottom:22px}
  .answer{width:100%;font-size:26px;text-align:center;padding:16px;border:2px solid var(--line);border-radius:14px;outline:none;font-weight:700}
  .answer:focus{border-color:var(--brand)}
  .scratch{margin-top:14px}
  .scratch-canvas{width:100%;height:220px;border:2px dashed var(--line);border-radius:14px;background:#fff;touch-action:none;display:block;cursor:crosshair}
  .scratch-tools .btn{margin-left:6px}
  #scratchToggle.active{background:#eaf0ff;color:var(--brand)}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:520px){.choices{grid-template-columns:1fr}}
  .choice{background:#f3f5fb;border:2px solid transparent;border-radius:14px;padding:16px;font-size:18px;font-weight:700;text-align:center;color:var(--ink)}
  .choice:hover{border-color:#d5ddf5}
  .choice.pick{border-color:var(--brand);background:#eaf0ff}
  .choice.right{border-color:var(--good);background:var(--good-bg);color:#0f7a4c}
  .choice.wrong{border-color:var(--bad);background:var(--bad-bg);color:#b02a3a}
  .choice[disabled]{cursor:default}

  .feedback{margin-top:18px;border-radius:14px;padding:16px;font-weight:600;display:none}
  .feedback.show{display:block}
  .feedback.ok{background:var(--good-bg);color:#0f7a4c;border:1px solid #bfe9d3}
  .feedback.no{background:var(--bad-bg);color:#b02a3a;border:1px solid #f6c8ce}
  .feedback .head{font-size:17px;font-weight:800;margin-bottom:4px}
  .feedback .exp{color:var(--ink);font-weight:500;margin-top:6px;font-size:14px}

  /* summary */
  .big-num{font-size:54px;font-weight:900;line-height:1}
  .statgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:18px 0}
  .stat{background:#f6f8fc;border-radius:14px;padding:14px;text-align:center}
  .stat b{font-size:24px;display:block}
  .medal{font-size:60px;text-align:center;margin:6px 0}
  .mistake-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .mistake-item .q{font-weight:700}
  .levelup{background:linear-gradient(135deg,#1faa6c,#3fd18b);color:#fff;border-radius:16px;padding:18px;text-align:center;margin-top:8px}

  .center{text-align:center}
  .grade-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
  .grade-opt{background:#f3f5fb;border:2px solid transparent;border-radius:14px;padding:16px 8px;text-align:center;font-weight:700}
  .grade-opt.pick{border-color:var(--brand);background:#eaf0ff}
  .grade-opt small{display:block;color:var(--muted);font-weight:600;font-size:11px;margin-top:2px}
  input.name{width:100%;font-size:18px;padding:14px;border:2px solid var(--line);border-radius:14px;outline:none}
  input.name:focus{border-color:var(--brand)}
  .footlink{color:var(--muted);font-size:12px;text-align:center;margin-top:20px}
  .footlink a{color:var(--brand);cursor:pointer;text-decoration:underline}
  /* learner switcher */
  .pbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .pchip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);color:var(--ink);
    padding:7px 14px 7px 7px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:var(--shadow)}
  .pchip .pav{width:24px;height:24px;border-radius:50%;background:#eef1f8;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;overflow:hidden;flex:none}
  .pav img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
  .avatar-btn{background:none;border:none;padding:0;cursor:pointer;position:relative;line-height:0}
  .avatar-btn .cam{position:absolute;right:-2px;bottom:-2px;background:var(--brand);color:#fff;width:20px;height:20px;border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
  .avatar-pick{width:80px;height:80px;border-radius:50%;border:2px dashed var(--brand);background:#eef1f8;font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;margin:0 auto}
  .avatar-pick img{width:100%;height:100%;object-fit:cover;border-radius:50%}
  .pchip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .pchip.active .pav{background:rgba(255,255,255,.25);color:#fff}
  .pchip.add{color:var(--brand);padding:7px 14px;border-style:dashed;box-shadow:none}
  .cloudbadge{display:inline-block}
  .map-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .map-row:last-child{border-bottom:none}
  .map-ic{width:26px;height:26px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
  .map-row.locked{opacity:.5}
  kbd{background:#eef1f8;border-radius:6px;padding:2px 7px;font-size:12px;border:1px solid var(--line)}
  /* games */
  .game-cta{background:linear-gradient(135deg,#ecfdf5,#fff)}
  .game-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:520px){.game-grid{grid-template-columns:1fr}}
  .game-tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px;align-items:center;cursor:pointer}
  .game-tile .ge{font-size:34px}
  .game-tile b{font-size:16px}
  .game-score{text-align:center;font-weight:800;color:var(--muted);margin-bottom:8px}
  .pic-big{font-size:78px;text-align:center;margin:4px 0;line-height:1.1}
  .build-line{text-align:center;margin:12px 0;min-height:40px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .build-line .blank{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:38px;border-bottom:3px solid var(--brand);font-size:26px;font-weight:800}
  .tile-row,.chip-row,.key-pad{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
  .ltile{width:46px;height:46px;border-radius:10px;background:#eef1f8;font-size:20px;font-weight:800;border:1px solid var(--line)}
  .ltile:disabled{opacity:.3}
  .wchip{background:#eef1f8;border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:16px;font-weight:700}
  .wchip.picked{background:#eaf0ff;border-color:var(--brand)}
  .wchip:disabled{opacity:.3}
  .sent-line{min-height:46px;background:#f6f8fc;border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
  .spell-line{text-align:center;font-size:30px;font-weight:800;letter-spacing:5px;margin:12px 0}
  .key{width:36px;height:42px;border-radius:8px;background:#eef1f8;font-weight:800;border:1px solid var(--line);font-size:16px}
  .key:disabled{opacity:.3}
  .mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
  .mem-card{aspect-ratio:1;border-radius:12px;background:linear-gradient(135deg,#4f6df5,#6b8bff);color:#fff;font-size:18px;font-weight:800;border:none;display:flex;align-items:center;justify-content:center;word-break:break-word;padding:3px;line-height:1.05}
  .mem-card.up{background:#fff;color:var(--ink);border:2px solid var(--brand);font-size:26px}
  .mem-card.up.wcard{font-size:15px}
  .mem-card.done{background:var(--good-bg);color:#0f7a4c;border:2px solid var(--good)}
</style>

<div class="wrap">
  <div class="top">
    <div class="logo" id="logoHome" title="Home"><span class="dot">✦</span> Aafi &amp; Aara Steps</div>
    <div class="row" style="gap:8px">
      <div id="streakBox" class="streak hidden">🔥 <span id="streakNum">0</span> day streak</div>
      <button id="homeBtn" class="homebtn hidden" title="Home">🏠 Home</button>
    </div>
  </div>
  <div id="app"></div>
  <div class="footlink" id="foot"></div>
</div>

<script>
/* =========================================================================
   Aafi and Aara Steps — a Kumon-style daily practice app (English + Maths, Grades 1–6)
   Single file, no dependencies. Multiple learners; progress saved in localStorage
   (with optional cloud backup). Each learner (sibling) has isolated progress.
   ========================================================================= */

const app = document.getElementById('app');
const foot = document.getElementById('foot');

/* ---------- multi-learner storage model ----------
   DB = { activeId, profiles:[ profile... ] }   (one profile per sibling)     */
const AAS_KEY = 'aafi_aara_steps_v1';
const LEGACY_KEY = 'brightsteps_v1';
const uid = ()=> 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function loadDB(){
  try{ const raw=JSON.parse(localStorage.getItem(AAS_KEY));
    if(raw && Array.isArray(raw.profiles)){ raw.profiles.forEach(migrateProfile); return raw; }
  }catch(e){}
  // migrate a single-profile save from the old app name, if present
  try{ const old=JSON.parse(localStorage.getItem(LEGACY_KEY));
    if(old && old.name){ old.id=uid(); migrateProfile(old); return {activeId:old.id, profiles:[old]}; }
  }catch(e){}
  return {activeId:null, profiles:[]};
}
function saveDB(){ localStorage.setItem(AAS_KEY, JSON.stringify(DB)); cloudMaybeSync(); }
function activeProfile(){ return DB.profiles.find(p=>p.id===DB.activeId) || null; }
function setActive(id){ DB.activeId=id; S=activeProfile(); saveDB(); renderHome(); }

/* ---------- small helpers ---------- */
const rnd = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick = arr => arr[rnd(0,arr.length-1)];
const shuffle = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]];} return a; };
const todayStr = ()=> new Date().toISOString().slice(0,10);
const norm = s => String(s).trim().toLowerCase().replace(/\s+/g,' ');

/* Build MCQ with distractors */
function mc(q, answer, distractors, explain){
  const choices = shuffle([answer, ...distractors]);
  return { q, a:String(answer), type:'mcq', choices, explain };
}

/* =========================================================================
   MATHS CURRICULUM — ordered ladder of skills (Grades 1–6).
   Each level has a generator that returns a fresh question every call.
   ========================================================================= */
const MATHS = [
  {g:1, title:'Number bonds to 10', gen:()=>{const a=rnd(1,9); return {q:`${a} + ⬚ = 10`, a:String(10-a), type:'input', explain:`10 − ${a} = ${10-a}`};}},
  {g:1, title:'Adding within 10', gen:()=>{const a=rnd(1,8),b=rnd(1,9-a); return {q:`${a} + ${b} = ?`, a:String(a+b), type:'input'};}},
  {g:1, title:'Taking away within 10', gen:()=>{const a=rnd(2,10),b=rnd(1,a); return {q:`${a} − ${b} = ?`, a:String(a-b), type:'input'};}},
  {g:1, title:'Adding within 20', gen:()=>{const a=rnd(5,15),b=rnd(2,20-a); return {q:`${a} + ${b} = ?`, a:String(a+b), type:'input'};}},
  {g:1, title:'Taking away within 20', gen:()=>{const a=rnd(10,20),b=rnd(1,a); return {q:`${a} − ${b} = ?`, a:String(a-b), type:'input'};}},
  {g:1, title:'Counting on and back', gen:()=>{const a=rnd(11,98); return Math.random()<.4 ? {q:`What number comes just before ${a}?`, a:String(a-1), type:'input'} : {q:`What number comes just after ${a}?`, a:String(a+1), type:'input'};}},
  {g:2, title:'Place value (tens & ones)', gen:()=>{const t=rnd(2,9),o=rnd(0,9),n=t*10+o; return Math.random()<.5 ? {q:`In the number ${n}, what is the digit ${t} worth?`, a:String(t*10), type:'input', explain:`${t} is in the tens place, so it is worth ${t*10}.`} : {q:`How many tens are in ${n}?`, a:String(t), type:'input', explain:`${n} = ${t} tens and ${o} ones.`};}},
  {g:2, title:'Comparing numbers', gen:()=>{let a=rnd(10,99),b=rnd(10,99); while(b===a)b=rnd(10,99); return Math.random()<.5 ? {q:`Which is greater: ${a} or ${b}? (write it)`, a:String(Math.max(a,b)), type:'input'} : {q:`Which is smaller: ${a} or ${b}? (write it)`, a:String(Math.min(a,b)), type:'input'};}},
  {g:2, title:'2-digit + 1-digit', gen:()=>{const a=rnd(11,89),b=rnd(2,9); return {q:`${a} + ${b} = ?`, a:String(a+b), type:'input'};}},
  {g:2, title:'2-digit + 2-digit (carrying)', gen:()=>{const a=rnd(15,79),b=rnd(15,79); return {q:`${a} + ${b} = ?`, a:String(a+b), type:'input', explain:'Add the ones first, carry the ten if it goes over 9.'};}},
  {g:2, title:'2-digit − 2-digit (borrowing)', gen:()=>{let a=rnd(30,99),b=rnd(11,a-1); return {q:`${a} − ${b} = ?`, a:String(a-b), type:'input', explain:'If the top digit is smaller, borrow 10 from the next column.'};}},
  {g:2, title:'Times tables: 2, 5, 10', gen:()=>{const t=pick([2,5,10]),n=rnd(2,12); return {q:`${t} × ${n} = ?`, a:String(t*n), type:'input', explain:`${t} added ${n} times.`};}},
  {g:3, title:'Times tables: 3 and 4', gen:()=>{const t=pick([3,4]),n=rnd(2,12); return {q:`${t} × ${n} = ?`, a:String(t*n), type:'input'};}},
  {g:3, title:'Times tables to 12 (mixed)', gen:()=>{const t=rnd(2,12),n=rnd(2,12); return {q:`${t} × ${n} = ?`, a:String(t*n), type:'input'};}},
  {g:3, title:'Division facts', gen:()=>{const b=rnd(2,12),ans=rnd(2,12); return {q:`${b*ans} ÷ ${b} = ?`, a:String(ans), type:'input', explain:`Because ${b} × ${ans} = ${b*ans}.`};}},
  {g:3, title:'3-digit addition', gen:()=>{const a=rnd(120,850),b=rnd(120,850); return {q:`${a} + ${b} = ?`, a:String(a+b), type:'input'};}},
  {g:3, title:'Rounding to the nearest 10', gen:()=>{const n=rnd(11,98),r=Math.round(n/10)*10; return {q:`Round ${n} to the nearest 10.`, a:String(r), type:'input', explain:`The ones digit decides: 5 or more rounds up. ${n} → ${r}.`};}},
  {g:4, title:'Long multiplication (2×1)', gen:()=>{const a=rnd(12,49),b=rnd(3,9); return {q:`${a} × ${b} = ?`, a:String(a*b), type:'input', explain:`${a}×${b}: multiply the ones and tens, then add.`};}},
  {g:4, title:'Division with remainders', gen:()=>{const b=rnd(3,9),q=rnd(3,12),r=rnd(1,b-1); const n=b*q+r; return {q:`${n} ÷ ${b} = ?  (write as "${q} r ${r}" style)`, a:`${q} r ${r}`, type:'input', explain:`${b}×${q}=${b*q}, and ${n}−${b*q}=${r} left over.`};}},
  {g:4, title:'Fractions of amounts', gen:()=>{const d=pick([2,3,4,5,10]),m=rnd(2,9),whole=d*m; return {q:`What is 1/${d} of ${whole}?`, a:String(whole/d), type:'input', explain:`Divide ${whole} by ${d}.`};}},
  {g:4, title:'Equivalent fractions', gen:()=>{const base=pick([[1,2],[1,3],[2,3],[1,4],[3,4],[1,5]]),m=rnd(2,5); return {q:`Fill the gap: ${base[0]}/${base[1]} = ⬚/${base[1]*m}`, a:String(base[0]*m), type:'input', explain:`Multiply top and bottom by ${m}: ${base[0]}×${m} = ${base[0]*m}.`};}},
  {g:4, title:'Perimeter of a rectangle', gen:()=>{const w=rnd(2,9),h=rnd(2,9); return {q:`A rectangle is ${w} cm by ${h} cm. What is its perimeter? (cm)`, a:String(2*(w+h)), type:'input', explain:`Add all four sides: 2 × (${w}+${h}) = ${2*(w+h)}.`};}},
  {g:5, title:'Adding decimals', gen:()=>{const a=(rnd(10,89)/10),b=(rnd(10,89)/10); return {q:`${a.toFixed(1)} + ${b.toFixed(1)} = ?`, a:(a+b).toFixed(1), type:'input', explain:'Line up the decimal points, then add.'};}},
  {g:5, title:'Adding fractions (same denominator)', gen:()=>{const d=pick([4,5,6,8,10]);let a=rnd(1,d-2),b=rnd(1,d-a-0); if(a+b>=d)b=d-a-1; if(b<1)b=1; return {q:`${a}/${d} + ${b}/${d} = ?  (write as x/${d})`, a:`${a+b}/${d}`, type:'input', explain:'Same denominator: just add the top numbers.'};}},
  {g:5, title:'Multiplying by 10 and 100', gen:()=>{const d=rnd(11,99)/10,by=pick([10,100]),ans=Number((d*by).toFixed(2)); return {q:`${d.toFixed(1)} × ${by} = ?`, a:String(ans), type:'input', explain:`× ${by} moves every digit ${by===10?'one place':'two places'} to the left.`};}},
  {g:5, title:'Percentages of amounts', gen:()=>{const p=pick([10,20,25,50]),base=pick([20,40,60,80,100,120,200]); return {q:`What is ${p}% of ${base}?`, a:String(base*p/100), type:'input', explain:`${p}% = ${p}/100. ${base} × ${p} ÷ 100.`};}},
  {g:5, title:'Area of a rectangle', gen:()=>{const w=rnd(3,12),h=rnd(2,9); return {q:`A rectangle is ${w} cm by ${h} cm. What is its area? (cm²)`, a:String(w*h), type:'input', explain:`Area = length × width = ${w} × ${h} = ${w*h}.`};}},

/* =========================================================================
   READING CURRICULUM — original passages + questions (Grades 1–6).
   Skills mined from Comprehension Skills 1–5, Basic Reading 1–5 and Peter &
   Jane: main idea → details/sequence → context clues → inference →
   compare / fact-vs-opinion → summarising & figurative language →
   author's purpose & tone. Passages are original (safe on a public link).
   ========================================================================= */
const READING = [
  {g:1, title:'Reading: main idea & details', items:[
    ()=>mc('Read: "Pip is a small dog. Pip likes to run and play. Pip likes to nap in the sun." What is this about?', 'A dog named Pip', ['A cat','A sunny day','A ball'], 'Every sentence is about Pip the dog.'),
    ()=>mc('Read: "The frog is green. It can hop very high. It lives by the pond." Where does the frog live?', 'By the pond', ['In a tree','In a box','On the sun'], 'The last sentence tells us.'),
    ()=>mc('Read: "Sam has a red hat. He wears it in the rain." Why does Sam wear the hat?', 'To keep dry in the rain', ['To go to bed','To eat lunch','To swim'], 'He wears it in the rain.'),
    ()=>mc('Read: "Ben and Jane like to play. They kick the ball. They laugh and run." What do Ben and Jane do?', 'They play with a ball', ['They sleep','They cook','They read'], 'They kick the ball and run.'),
    ()=>mc('Read: "The hen sat on her eggs. Soon the eggs went crack. Out came the chicks!" What came out of the eggs?', 'Chicks', ['Frogs','Fish','Cats'], 'Chicks hatch from a hen’s eggs.'),
    ()=>mc('Read: "I can see a big bus. The bus is red. It takes us to school." What colour is the bus?', 'Red', ['Blue','Green','Yellow'], 'The bus is red.'),
    ()=>mc('Read: "It is hot today. We put on hats. We drink cool water." Why do they drink cool water?', 'Because it is hot', ['Because it is cold','Because it is dark','Because it rains'], 'It is hot, so cool water helps.'),
    ()=>mc('Read: "We went to the park. We played on the swings. Then we had ice cream." What did they do last?', 'Had ice cream', ['Went to the park','Played on swings','Went to bed'], '"Then" tells us ice cream was last.'),
    ()=>mc('Read: "A duck can swim. A duck can walk. A duck says quack!" What sound does a duck make?', 'Quack', ['Moo','Woof','Meow'], 'A duck says quack.'),
    ()=>mc('Read: "Jane has a new bike. It is blue and fast. She rides it to the shop." Where does Jane ride her bike?', 'To the shop', ['To the moon','To school','To bed'], 'She rides it to the shop.'),
  ]},
  {g:2, title:'Reading: details & sequence', items:[
    ()=>mc('Read: "First, Mia poured the milk. Next, she added the oats. Last, she ate her breakfast." What did Mia do first?', 'Poured the milk', ['Added the oats','Ate breakfast','Washed up'], '"First" signals the first step.'),
    ()=>mc('Read: "The snail is very slow. It carries its shell on its back. The shell keeps it safe." How does the shell help the snail?', 'It keeps it safe', ['It helps it run','It gives it food','It makes noise'], 'The passage says the shell keeps it safe.'),
    ()=>mc('Read: "Tom planted a seed. He watered it every day. After a week, a green shoot appeared." What made the shoot grow?', 'Watering it every day', ['Leaving it dry','Hiding it','Eating it'], 'He watered it daily and it grew.'),
    ()=>mc('Read: "Owls sleep in the day and hunt at night. Their big eyes help them see in the dark." When do owls hunt?', 'At night', ['In the morning','At noon','In the day'], 'Owls hunt at night.'),
    ()=>mc('Read: "The ice cream melted because the sun was hot." Why did the ice cream melt?', 'The sun was hot', ['It was cold','It was old','It was small'], '"because" gives the reason.'),
    ()=>mc('Read: "Spiders are not insects. Insects have six legs, but spiders have eight." How many legs does a spider have?', 'Eight', ['Six','Four','Two'], 'Spiders have eight legs.'),
    ()=>mc('Read: "When the bell rang, the children lined up. Then they walked quietly to class." What did the children do right after the bell?', 'Lined up', ['Ran home','Ate lunch','Fell asleep'], 'They lined up when the bell rang.'),
    ()=>mc('Read: "Bats sleep upside down. They hang from their feet in dark caves." Where do bats sleep?', 'In dark caves', ['On sunny beaches','In warm nests','Under water'], 'They hang in dark caves.'),
    ()=>mc('Read: "Lily was sad when it rained and could not go out. Then the sun came out and she cheered." Why did Lily cheer?', 'The sun came out so she could go outside', ['It kept raining','She lost her toy','It got dark'], 'The sun let her go outside.'),
    ()=>mc('Read: "Bees make honey. First they gather nectar from flowers. Then they store it in the hive." What do bees gather first?', 'Nectar from flowers', ['Honey from shops','Water from ponds','Leaves from trees'], 'They gather nectar first, then store it.'),
  ]},
  {g:3, title:'Reading: context clues & inference', items:[
    ()=>mc('Read: "The path was slippery, so we tried not to slip and fall." "Slippery" means…', 'easy to slide on', ['very dry','very warm','very loud'], 'The clue is "slip and fall".'),

    ()=>mc('Read: "The chef was furious when the soup was served cold." "Furious" means…', 'very angry', ['very pleased','very calm','very tired'], 'Cold soup made the chef very angry.'),
    ()=>mc('Read: "Every shelf was empty and the lights were off. A sign read: Closed." What can you tell about the shop?', 'It was not open', ['It was busy','It was new','It was full'], 'Empty shelves and a Closed sign.'),
    ()=>mc('Read: "The ancient castle had crumbling walls and towers hundreds of years old." "Ancient" means…', 'very old', ['brand new','very small','very clean'], 'Hundreds of years old = ancient.'),
    ()=>mc('Read: "Maya packed her suitcase, checked her passport, and set an early alarm." What is Maya about to do?', 'Go on a trip', ['Cook dinner','Go to school','Clean her room'], 'Suitcase and passport suggest travelling.'),
  ]},
  {g:4, title:'Reading: inference, compare & fact/opinion', items:[
    ()=>mc('Read: "Unlike frogs, which need water, toads can live in drier places." How are toads different from frogs?', 'Toads can live in drier places', ['Toads need more water','Toads cannot hop','Toads are fish'], 'The word "unlike" signals the difference.'),
    ()=>mc('Read: "The abandoned house had broken windows, and weeds grew waist-high in the garden." What can you infer?', 'No one has lived there for a long time', ['Someone cleaned it today','It was just built','A party is on'], 'Broken windows and tall weeds imply neglect.'),
    ()=>mc('Which of these is an OPINION?', 'Chocolate ice cream is the best flavour.', ['Ice cream is a frozen food.','Ice cream can melt.','Some ice cream is made from milk.'], 'A "best" claim is a personal opinion.'),
    ()=>mc('Which of these is a FACT?', 'Water freezes at 0 degrees Celsius.', ['Winter is the nicest season.','Blue is a boring colour.','Everyone loves snow.'], 'It can be checked and proven.'),
    ()=>mc('Read: "Penguins have wings but cannot fly. Instead, they use them like flippers to swim." What do penguins use their wings for?', 'Swimming', ['Flying high','Building nests','Making noise'], 'They use wings like flippers to swim.'),
    ()=>mc('Read: "By the time we reached the top, my legs ached and I was gasping for breath." What can you infer about the climb?', 'It was hard work', ['It was very easy','It was downhill','It was short'], 'Aching legs and gasping suggest a tough climb.'),
    ()=>mc('Read: "Camels store fat in their humps, which helps them survive long trips without food." How do humps help camels?', 'They store energy for long journeys', ['They hold water bottles','They help them fly','They only keep them cool'], 'Stored fat = energy when food is scarce.'),
    ()=>mc('Read: "Cats and lions both have whiskers and sharp claws, but lions are far larger." Name one way they are alike.', 'They both have whiskers and claws', ['They are the same size','Both live in houses','Neither has claws'], 'Whiskers and claws are shared.'),
    ()=>mc('Read: "The sky turned dark, thunder rumbled, and everyone hurried indoors." What probably happened next?', 'A storm', ['A sunny picnic','A snowman','Only a rainbow'], 'Dark sky and thunder point to a storm.'),
    ()=>mc('Which is an OPINION?', 'Reading is more fun than maths.', ['Books have pages.','Maths uses numbers.','A library lends books.'], '"More fun" is a personal view.'),
  ]},
  {g:5, title:'Reading: summarising & figurative language', items:[
    ()=>mc('Read: "Some police in Paris patrol on inline skates, weaving through heavy traffic to reach trouble fast." Best main idea?', 'Skates help some Paris police do their job', ['Paris has heavy traffic','Skating is a fun hobby','Police wear helmets'], 'It is mainly about how skates help police work.'),

    ()=>mc('Read: "The instructions were needlessly complex, burying one simple step under a dozen confusing ones." What is the tone?', 'Critical / frustrated', ['Cheerful','Neutral and factual','Admiring'], '"Needlessly" and "confusing" show frustration.'),

    ()=>mc('Read: "Scientists measured the glacier each year and recorded that it had retreated two metres annually." The author’s main purpose is…', 'To inform with facts', ['To sell a product','To tell a joke','To frighten readers'], 'Measured data = informing.'),
    ()=>mc('Read: "He called the meal ‘interesting’, then pushed the plate away after a single bite." What does the writer imply?', 'He did not really like the meal', ['He loved the meal','He was very hungry','He cooked it himself'], 'Pushing it away after one bite implies dislike.'),
    ()=>mc('"Time is a thief." This metaphor suggests that…', 'time takes things away from us', ['thieves are slow','clocks are often stolen','time can be caught'], 'Time "steals" moments from us.'),

    ()=>mc('Read: "Sure, waking at 5am to revise sounded absolutely delightful." The writer is using…', 'sarcasm', ['a plain fact','a simile','an instruction'], 'The real meaning is the opposite of "delightful".'),

/* subject registry — makes Maths, English and Reading interchangeable */
const SUBJECTS = {
  maths:   { label:'Maths',   icon:'🔢', ladder:MATHS },
  english: { label:'English', icon:'📖', ladder:ENGLISH },
  reading: { label:'Reading', icon:'📚', ladder:READING },
};
const SUBJECT_KEYS = ['maths','english','reading'];
function ladderOf(sub){ return SUBJECTS[sub].ladder; }

/* =========================================================================
   STATE
   ========================================================================= */
function freshState(name, grade){
  const startIdx = (ladder)=>{ const i=ladder.findIndex(l=>l.g===grade); return i<0?0:i; };
  return {
    id: uid(), name, grade,
    maths:{ level: startIdx(MATHS), attempts:0, mastered:0 },
    english:{ level: startIdx(ENGLISH), attempts:0, mastered:0 },
    reading:{ level: startIdx(READING), attempts:0, mastered:0 },
    streak:0, lastActive:null, xp:0,
    corrections:{ maths:[], english:[], reading:[] }, // carried-over mistakes to redo next time
    doneToday:{ date:null, maths:false, english:false, reading:false },
    log:[]  // session history for the parent dashboard: {date, sub, title, grade, acc, right, total, fixed, mistakes:[...]}
  };
}
/* ensure older saved profiles gain any newly-added subjects/fields */
function migrateProfile(p){
  if(!p.log) p.log=[];
  if(!p.corrections) p.corrections={};
  if(!p.doneToday) p.doneToday={date:null};
  SUBJECT_KEYS.forEach(sub=>{
    if(!p[sub]){ const i=SUBJECTS[sub].ladder.findIndex(l=>l.g===p.grade); p[sub]={ level:i<0?0:i, attempts:0, mastered:0 }; }
    if(!p.corrections[sub]) p.corrections[sub]=[];
    if(p.doneToday[sub]===undefined) p.doneToday[sub]=false;
  });
  return p;
}
function save(){ saveDB(); }          // persist the whole DB (active profile is a reference inside it)
let DB = loadDB();
let S = activeProfile();

/* streak / daily bookkeeping */
function touchDay(){
  const t = todayStr();
  if(S.doneToday.date !== t){ S.doneToday = {date:t, maths:false, english:false, reading:false}; }
  if(S.lastActive !== t){
    const yest = new Date(Date.now()-864e5).toISOString().slice(0,10);
    S.streak = (S.lastActive===yest) ? S.streak+1 : 1;
    S.lastActive = t;
  }
}

function subjectCard(sub){
  const ladder = ladderOf(sub);
  const st = S[sub];
  const lvl = ladder[st.level];
  const pct = Math.round((st.level/(ladder.length))*100);
  const done = S.doneToday.date===todayStr() && S.doneToday[sub];
  const pending = S.corrections[sub].length;
  return `
    <div class="subject ${sub}">
      ${done?'<div class="done-tag">✓ Done today</div>':''}
      <h2>${SUBJECTS[sub].icon} ${SUBJECTS[sub].label}</h2>
      <div class="lvl">Level ${st.level+1} of ${ladder.length} · Grade ${lvl.g}<br><b>${lvl.title}</b></div>
      <div class="progress"><i style="width:${pct}%"></i></div>
      ${pending?`<div class="small" style="margin:-6px 0 10px">📌 ${pending} correction${pending>1?'s':''} to fix first</div>`:''}
      <button class="btn wide" data-start="${sub}">${done?'Practice again':'Start today\'s worksheet'}</button>
    </div>`;
}

/* open the picker, downscale to a small square JPEG (keeps storage/Drive light) */
function pickPhoto(cb){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{ const img=new Image();
      img.onload=()=>{ const s=Math.min(img.width,img.height), c=document.createElement('canvas'); c.width=c.height=160;
        c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,160,160);
        cb(c.toDataURL('image/jpeg',0.82)); };
      img.onerror=()=>alert('Sorry — that image could not be read.'); img.src=rd.result; };
    rd.readAsDataURL(f); };
  inp.click();
}
function changePhoto(id){ const p=DB.profiles.find(x=>x.id===id); if(!p) return; pickPhoto(d=>{ p.photo=d; saveDB(); renderHome(); }); }

/* =========================================================================
   PARENT DASHBOARD — which skills are strong and which need work
   ========================================================================= */
function subjectSnapshot(sub){
  const ladder=ladderOf(sub), st=S[sub];
  const entries=(S.log||[]).filter(e=>e.sub===sub);
  const r=entries.reduce((s,e)=>s+e.right,0), t=entries.reduce((s,e)=>s+e.total,0);
  const acc=t?Math.round(r/t*100):0, lvl=ladder[st.level], pct=Math.round((st.level/ladder.length)*100);
  const col = !entries.length?'var(--muted)':acc>=80?'var(--good)':acc>=60?'var(--warn)':'var(--bad)';
  const barCol = sub==='maths'?'var(--maths)':sub==='english'?'var(--english)':'var(--reading)';
  return `<div class="card">
    <div class="spread"><h2 style="margin:0">${SUBJECTS[sub].icon} ${SUBJECTS[sub].label}</h2><span class="small muted">${entries.length} worksheet${entries.length===1?'':'s'}</span></div>
    <div class="row" style="padding:8px 0 4px">
      <div style="flex:1">
        <div class="small muted">Current level (${st.level+1} of ${ladder.length})</div>
        <b>${lvl.title}</b> <span class="small muted">· Grade ${lvl.g}</span>
      </div>
      <div class="center"><div style="font-size:22px;font-weight:900;color:${col}">${entries.length?acc+'%':'—'}</div><div class="small muted">first-try</div></div>
    </div>
    <div class="progress" style="background:var(--line);margin:8px 0 6px"><i style="width:${pct}%;background:${barCol}"></i></div>
    <div class="small muted">${st.mastered} level${st.mastered===1?'':'s'} mastered so far.</div>
  </div>`;
}

function renderParent(){
  const log = S.log||[];
  const fmtDate = ds => { const d=new Date(ds+'T00:00:00'); return isNaN(d)?ds:d.toLocaleDateString(undefined,{day:'numeric',month:'short'}); };
  const icon = sub => (SUBJECTS[sub] ? SUBJECTS[sub].icon : '•');
  const pill = acc => { const [bg,fg,label] = acc>=85?['#e6f7ef','#0f7a4c','Strong']:acc>=70?['#fff4e0','#a86b00','Developing']:['#fdecee','#b02a3a','Needs work']; return `<span class="pill" style="background:${bg};color:${fg}">${label} · ${acc}%</span>`; };

  const sessions=log.length, days=new Set(log.map(e=>e.date)).size;
  const totRight=log.reduce((s,e)=>s+e.right,0), totQ=log.reduce((s,e)=>s+e.total,0);
  const overallAcc=totQ?Math.round(totRight/totQ*100):0;
  const weekSessions=log.filter(e=>(e.ts||0)>=Date.now()-7*864e5).length;

  // aggregate per skill
  const skills={};
  log.forEach(e=>{ const k=e.sub+'|'+e.title; if(!skills[k]) skills[k]={sub:e.sub,title:e.title,grade:e.grade,right:0,total:0,sessions:0}; const s=skills[k]; s.right+=e.right; s.total+=e.total; s.sessions++; });
  const skillArr=Object.values(skills).map(s=>({...s, acc:s.total?Math.round(s.right/s.total*100):0}));
  const needs=skillArr.filter(s=>s.acc<80).sort((a,b)=>a.acc-b.acc);
  const strong=skillArr.filter(s=>s.acc>=85).sort((a,b)=>b.acc-a.acc);

  // recent mistakes (newest first, max 12)
  let mistakes=[];
  for(let i=log.length-1;i>=0 && mistakes.length<12;i--){ const e=log[i]; (e.mistakes||[]).forEach(m=>{ if(mistakes.length<12) mistakes.push({...m, sub:e.sub, date:e.date}); }); }
  const recent=log.slice(-8).reverse();

  app.innerHTML = `
    <div class="card">
      <div class="spread"><h1 style="margin:0">👪 Parent dashboard</h1><button class="btn ghost" id="back">← Back</button></div>

    <div class="card">
      <div class="statgrid" style="grid-template-columns:repeat(4,1fr)">
        <div class="stat"><b>🔥 ${S.streak}</b><span class="small muted">day streak</span></div>
        <div class="stat"><b>${sessions}</b><span class="small muted">worksheets</span></div>
        <div class="stat"><b>${overallAcc}%</b><span class="small muted">first-try avg</span></div>
        <div class="stat"><b>${weekSessions}</b><span class="small muted">this week</span></div>
      </div>
      <p class="small muted" style="margin:2px 0 0">Practised on ${days} day${days===1?'':'s'} · ${S.xp} XP earned. "First-try" = correct before any correction.</p>
    </div>
    ${subjectSnapshot('maths')}
    ${subjectSnapshot('english')}
    ${subjectSnapshot('reading')}
    <div class="card">
      <h2>🎯 Skills to practise next</h2>
      ${needs.length ? `<p class="small muted" style="margin-top:-6px">Ranked by first-try accuracy, lowest first — these are worth revisiting.</p>
        ${needs.slice(0,8).map(s=>`<div class="map-row">
          <span class="map-ic" style="background:${s.acc>=70?'var(--warn)':'var(--bad)'}">${icon(s.sub)}</span>
          <div style="flex:1"><b>${s.title}</b> <span class="small muted">· ${SUBJECTS[s.sub].label} · Grade ${s.grade} · ${s.sessions} attempt${s.sessions>1?'s':''}</span></div>
          ${pill(s.acc)}
        </div>`).join('')}`
        : `<div class="mistake-item center" style="border-color:var(--good);background:var(--good-bg)"><b>✨ Every practised skill is at 80% or better — great work!</b></div>`}
    </div>
    ${strong.length?`<div class="card"><h2>💪 Strong skills</h2>
      ${strong.slice(0,6).map(s=>`<div class="map-row"><span class="map-ic" style="background:var(--good)">${icon(s.sub)}</span>
        <div style="flex:1"><b>${s.title}</b> <span class="small muted">· ${SUBJECTS[s.sub].label} · Grade ${s.grade}</span></div>${pill(s.acc)}</div>`).join('')}</div>`:''}
    <div class="card">
      <h2>📌 Recent mistakes</h2>
      ${mistakes.length? mistakes.map(m=>`<div class="mistake-item"><div class="q">${icon(m.sub)} ${m.q}</div>
        <div class="small"><span style="color:var(--bad)">Answered: ${m.given||'—'}</span> · <span style="color:var(--good)">Correct: ${m.a}</span> <span class="muted">· ${fmtDate(m.date)}</span></div></div>`).join('')
        : `<p class="muted small">No mistakes recorded recently — nice!</p>`}
    </div>
    <div class="card">
      <h2>🗓️ Recent worksheets</h2>
      ${recent.map(e=>`<div class="map-row">
        <span class="map-ic" style="background:${e.acc>=80?'var(--good)':e.acc>=60?'var(--warn)':'var(--bad)'}">${icon(e.sub)}</span>
        <div style="flex:1"><b>${e.title}</b> <span class="small muted">· ${fmtDate(e.date)}${e.levelChange==='up'?' · ⬆️ levelled up':e.levelChange==='repeat'?' · 🔁 repeating':''}</span></div>
        <span class="small" style="font-weight:800;color:${e.acc>=80?'var(--good)':e.acc>=60?'var(--warn)':'var(--bad)'}">${e.acc}%</span>
      </div>`).join('')}
    </div>
    `}
    <div class="card" style="border-color:#f6c8ce">
      <h2 style="color:var(--bad);margin-bottom:4px">⚠️ Reset progress</h2>
      <p class="small muted" style="margin-top:0">Wipe all of ${S.name}'s levels, streak, XP and history back to the start. Their name, photo and grade are kept. This cannot be undone.</p>
      <button class="btn danger" id="resetProg">↺ Reset ${S.name}'s progress</button>
    </div>
  `;
  const b=document.getElementById('back'); if(b) b.onclick=renderHome;
  const b2=document.getElementById('back2'); if(b2) b2.onclick=renderHome;
  document.getElementById('resetProg').onclick=resetProgress;
  foot.innerHTML='';
}
/* reset the active learner's progress — TWO confirmations required */
function resetProgress(){
  const name=S.name;
  if(!confirm(`Reset ALL of ${name}'s progress?\n\nThis clears every level, streak, XP and mistake history and starts fresh. Their profile and photo are kept.`)) return;
  const typed=prompt(`This cannot be undone.\n\nType ${name}'s name below to confirm the reset:`);
  if(typed===null) return;
  if(norm(typed)!==norm(name)){ alert('That did not match the name — reset cancelled. Nothing was changed.'); return; }
  SUBJECT_KEYS.forEach(sub=>{ const i=SUBJECTS[sub].ladder.findIndex(l=>l.g===S.grade); S[sub]={ level:i<0?0:i, attempts:0, mastered:0 }; });
  S.xp=0; S.streak=0; S.lastActive=null; S.log=[];
  S.corrections={ maths:[], english:[], reading:[] };
  S.doneToday={ date:null, maths:false, english:false, reading:false };
  saveDB();
  alert(`${name}'s progress has been reset to the start.`);
  renderParent();
}

/* =========================================================================
   SESSION ENGINE — worksheet + correction loop
   ========================================================================= */
const QUESTIONS_PER_SET = 10;
const MASTER_PCT = 80;   // first-try accuracy to level up
const REPEAT_PCT = 60;   // below this, repeat the level

let SES = null;

function buildQuestions(sub){
  const ladder=ladderOf(sub); const lvl=ladder[S[sub].level];
  let qs=[];
  if(sub==='maths'){
    for(let i=0;i<QUESTIONS_PER_SET;i++) qs.push(lvl.gen());
  }else{
    let pool=shuffle(lvl.items.map(fn=>fn()));
    while(pool.length<QUESTIONS_PER_SET) pool=pool.concat(shuffle(lvl.items.map(fn=>fn())));
    qs=pool.slice(0,QUESTIONS_PER_SET);
  }
  return qs;
}

function startSession(sub){
  touchDay();
  const carried = S.corrections[sub].map(c=>({...c, carried:true})); // yesterday's mistakes first
  SES = {
    sub,
    main: [...carried, ...buildQuestions(sub)],
    idx:0,
    retry:[],           // wrong-this-session, to be re-done at the end
    stage: carried.length? 'correct-carry':'main',
    firstTryRight:0, firstTryTotal:0,
    mistakes:[],        // for the summary
    answeredThisQ:false
  };
  renderQuestion();
}

function currentQ(){
  if(SES.stage==='retry') return SES.retry[0];
  return SES.main[SES.idx];
}
function totalMain(){ return SES.main.length; }

function renderQuestion(){
  const q=currentQ();
  const inCorrection = (SES.stage==='retry' || q.carried);
  const progressCount = SES.stage==='retry' ? `Fixing ${SES.retry.length} left` : `${Math.min(SES.idx+1,totalMain())} / ${totalMain()}`;
  const pct = SES.stage==='retry' ? 100 : Math.round((SES.idx/totalMain())*100);
  SES.answeredThisQ=false;
  app.innerHTML = `
    <div class="card">
      <div class="qbar">
        <span class="qcount">${SUBJECTS[SES.sub].icon}</span>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <span class="stage ${inCorrection?'correcting':''}">${inCorrection?'✎ Correction':progressCount}</span>
      </div>
      ${inCorrection?'<p class="small" style="color:var(--bad);margin:6px 0 -6px;font-weight:700">Let\'s fix this one — take your time.</p>':''}
      <div class="question">${q.q}</div>
      ${q.type==='mcq'
        ? `<div class="choices" id="choices">${q.choices.map(c=>`<button class="choice" data-c="${encodeURIComponent(c)}">${c}</button>`).join('')}</div>`
        : `<input class="answer" id="ans" autocomplete="off" autocapitalize="off" placeholder="Type your answer">
           <button class="btn wide" id="checkBtn" style="margin-top:12px">Check ✓</button>
           <p class="qhint small" style="margin-top:8px">…or press <kbd>Enter</kbd></p>
           ${SES.sub==='maths' ? `
           <div class="scratch">
             <div class="spread" style="margin-bottom:6px">
               <button type="button" class="btn ghost" id="scratchToggle" style="padding:8px 14px;font-size:14px">✏️ Scratchpad</button>
               <span class="scratch-tools hidden" id="scratchTools">
                 <button type="button" class="btn ghost" id="scratchUndo" style="padding:8px 12px;font-size:13px">↶ Undo</button>
                 <button type="button" class="btn ghost" id="scratchClear" style="padding:8px 12px;font-size:13px">Clear</button>
               </span>
             </div>
             <canvas id="scratchPad" class="scratch-canvas hidden"></canvas>
             <p class="qhint small scratch-hint hidden" id="scratchHint">Work it out here with your finger or stylus, then type the answer above.</p>
           </div>` : ''}`}
      <div class="feedback" id="fb"></div>
      <div id="next" style="margin-top:16px"></div>
    </div>`;

  if(q.type==='mcq'){
    document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>submitMC(decodeURIComponent(b.dataset.c), b));
  }else{
    const inp=document.getElementById('ans');
    inp.focus();
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ if(!SES.answeredThisQ) submitInput(); else advance(); }});
    document.getElementById('checkBtn').onclick=()=>{ if(!SES.answeredThisQ) submitInput(); };
    setupScratchpad();
  }
}

/* stylus/finger scratchpad for working out maths (answer is still typed) */
function setupScratchpad(){
  const pad=document.getElementById('scratchPad'); if(!pad) return;
  const toggle=document.getElementById('scratchToggle'), tools=document.getElementById('scratchTools'), hint=document.getElementById('scratchHint');
  const ctx=pad.getContext('2d');
  let strokes=[], cur=null, drawing=false, sized=false;
  function size(){
    const w=pad.clientWidth||pad.parentElement.clientWidth||300, cssH=220, dpr=window.devicePixelRatio||1;
    pad.width=w*dpr; pad.height=cssH*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=3; ctx.strokeStyle='#1f2a44';
    redraw();
  }
  function redraw(){ ctx.clearRect(0,0,pad.width,pad.height); strokes.forEach(s=>{ if(s.length<2) return; ctx.beginPath(); s.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke(); }); }
  function pos(e){ const r=pad.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
  pad.addEventListener('pointerdown',e=>{ e.preventDefault(); drawing=true; cur=[pos(e)]; strokes.push(cur); try{pad.setPointerCapture(e.pointerId);}catch(_){} });
  pad.addEventListener('pointermove',e=>{ if(!drawing) return; e.preventDefault(); const p=pos(e), prev=cur[cur.length-1]; cur.push(p); ctx.beginPath(); ctx.moveTo(prev.x,prev.y); ctx.lineTo(p.x,p.y); ctx.stroke(); });
  const stop=()=>{ drawing=false; cur=null; };
  pad.addEventListener('pointerup',stop); pad.addEventListener('pointercancel',stop); pad.addEventListener('pointerleave',stop);
  toggle.onclick=()=>{
    const open = pad.classList.toggle('hidden')===false;
    tools.classList.toggle('hidden',!open); hint.classList.toggle('hidden',!open); toggle.classList.toggle('active',open);
    if(open && !sized){ sized=true; requestAnimationFrame(size); }
  };
  document.getElementById('scratchClear').onclick=()=>{ strokes=[]; redraw(); };
  document.getElementById('scratchUndo').onclick=()=>{ strokes.pop(); redraw(); };
}

function judge(correct, q, userAns){
  SES.answeredThisQ=true;
  const cb=document.getElementById('checkBtn'); if(cb) cb.style.display='none';
  const fb=document.getElementById('fb');
  const isFirstMain = (SES.stage!=='retry');
  if(isFirstMain){ SES.firstTryTotal++; if(correct) SES.firstTryRight++; }

  if(correct){
    S.xp += (SES.stage==='retry'?1:2); save();
    fb.className='feedback show ok';
    fb.innerHTML=`<div class="head">✅ Correct!</div>${q.explain?`<div class="exp">${q.explain}</div>`:''}`;
    if(SES.stage==='retry'){
      SES.retry.shift(); // fixed one
      // remove from carried corrections store if it was one
    }
  }else{
    fb.className='feedback show no';
    fb.innerHTML=`<div class="head">Not quite.</div>The correct answer is <b>${q.a}</b>.${q.explain?`<div class="exp">${q.explain}</div>`:''}`;
    // record mistake for summary + queue a retry (only queue once per unique question)
    if(SES.stage!=='retry'){
      SES.mistakes.push({q:q.q, a:q.a, given:userAns});
      SES.retry.push(q);
    }
  }
  const nx=document.getElementById('next');
  const last = isLastStep();
  nx.innerHTML=`<button class="btn wide" id="nextBtn">${last?'See results →':'Next →'}</button>`;
  document.getElementById('nextBtn').onclick=advance;
  document.getElementById('nextBtn').focus();
}

function isLastStep(){
  if(SES.stage==='retry') return SES.retry.length<=1; // this is the last retry (will be shifted on correct)
  // main not finished, or main finished but retries exist
  const mainLeft = SES.idx < totalMain()-1;
  if(mainLeft) return false;
  return SES.retry.length===0; // last main and nothing to fix
}

function submitInput(){
  const val=document.getElementById('ans').value;
  if(val.trim()==='') return;
  const q=currentQ();
  const correct = norm(val)===norm(q.a) || norm(val).replace(/\s/g,'')===norm(q.a).replace(/\s/g,'');
  judge(correct,q,val);
}
function submitMC(choice, btn){
  const q=currentQ();
  // Multiple-choice answers are picked from the given options, so match EXACTLY.
  // (Case and punctuation matter here — e.g. "Capital letters" questions.)
  const correct = choice===q.a;
  document.querySelectorAll('.choice').forEach(b=>{
    b.disabled=true;
    const c=decodeURIComponent(b.dataset.c);
    if(c===q.a) b.classList.add('right');
    else if(b===btn) b.classList.add('wrong');
  });
  judge(correct,q,choice);
}

function advance(){
  if(SES.stage!=='retry'){
    SES.idx++;
    if(SES.idx>=totalMain()){
      // main done → move to retry stage if there are mistakes
      if(SES.retry.length){ SES.stage='retry'; renderQuestion(); return; }
      return finish();
    }
    renderQuestion();
  }else{
    // in retry: if the last answer was correct it was shifted already; if wrong, it stays (re-ask)
    if(SES.retry.length===0) return finish();
    renderQuestion();
  }
}

/* =========================================================================
   FINISH — grade the set, update mastery, save corrections
   ========================================================================= */
function finish(){
  const sub=SES.sub;
  const acc = SES.firstTryTotal? Math.round(SES.firstTryRight/SES.firstTryTotal*100):100;
  const ladder=ladderOf(sub);
  const practiced = ladder[S[sub].level]; // capture BEFORE any level-up
  S[sub].attempts++;
  // mark done today
  if(S.doneToday.date!==todayStr()) S.doneToday={date:todayStr(),maths:false,english:false};
  S.doneToday[sub]=true;

  // Any questions the learner still couldn't fix are impossible here (retry loop forces correction),
  // so corrections store is cleared for carried items; brand-new persistent corrections aren't needed
  // because everything was corrected in-session. We keep the store for future extension:
  S.corrections[sub]=[];

  let levelChange='none';
  if(acc>=MASTER_PCT && S[sub].level < ladder.length-1){ S[sub].level++; S[sub].mastered++; levelChange='up'; S.xp+=10; }
  else if(acc>=MASTER_PCT && S[sub].level===ladder.length-1){ levelChange='max'; S.xp+=10; }
  else if(acc<REPEAT_PCT){ levelChange='repeat'; }

  // record this session for the parent dashboard (keep the most recent 80)
  S.log.push({
    date: todayStr(), ts: Date.now(), sub,
    title: practiced.title, grade: practiced.g,
    acc, right: SES.firstTryRight, total: SES.firstTryTotal,
    fixed: SES.mistakes.length, levelChange,
    mistakes: SES.mistakes.map(m=>({q:m.q, a:m.a, given:m.given}))
  });
  if(S.log.length>80) S.log = S.log.slice(-80);
  save();

  const medal = acc>=90?'🥇':acc>=80?'🥈':acc>=60?'🥉':'💪';
  const msg = acc>=90?'Outstanding!':acc>=80?'Great job!':acc>=60?'Good effort!':'Keep going — you\'ll get it!';
  let banner='';
  if(levelChange==='up') banner=`<div class="levelup">⬆️ Level up! You’ve moved on to<br><b>${ladder[S[sub].level].title}</b></div>`;
  else if(levelChange==='max') banner=`<div class="levelup">🏆 You’ve reached the top level in ${SUBJECTS[sub].label}!</div>`;
  else if(levelChange==='repeat') banner=`<div class="levelup" style="background:linear-gradient(135deg,#f0a500,#ffc44d)">🔁 We’ll practise this level again to make it stick.</div>`;

  const mistakesHtml = SES.mistakes.length
    ? `<h2 style="margin-top:20px">📌 Mistakes you fixed</h2>
       <p class="small muted" style="margin-top:-6px">You corrected every one of these — that’s how learning sticks.</p>
       ${SES.mistakes.map(m=>`<div class="mistake-item"><div class="q">${m.q}</div>
         <div class="small"><span style="color:var(--bad)">Your first try: ${m.given||'—'}</span> · <span style="color:var(--good)">Correct: ${m.a}</span></div></div>`).join('')}`
    : `<div class="mistake-item center" style="border-color:var(--good);background:var(--good-bg)"><b>✨ No mistakes — a perfect worksheet!</b></div>`;

  app.innerHTML=`
    <div class="card center">
      <div class="medal">${medal}</div>
      <h1 style="margin-bottom:0">${msg}</h1>
      <p class="muted">${SUBJECTS[SES.sub].label} · ${ladder[SES.firstTryTotal? Math.max(0,S[sub].level-(levelChange==='up'?1:0)):S[sub].level].title}</p>
      <div class="statgrid">
        <div class="stat"><b>${acc}%</b><span class="small muted">first-try score</span></div>
        <div class="stat"><b>${SES.firstTryRight}/${SES.firstTryTotal}</b><span class="small muted">right first time</span></div>
        <div class="stat"><b>${SES.mistakes.length}</b><span class="small muted">fixed</span></div>
      </div>
      ${banner}
    </div>
    <div class="card">${mistakesHtml}</div>
    ${acc>=MASTER_PCT ? `<p class="center small muted" style="margin:-4px 0 10px">Finding it easy? Tap “Do another” to keep climbing — each one you master moves ${S.name} up a level.</p>`:''}
    <div class="row" style="gap:10px">
      <button class="btn big" id="again" style="flex:1">Do another →</button>
      <button class="btn big ghost" id="home" style="flex:1">Home</button>
    </div>`;
  document.getElementById('home').onclick=renderHome;
  document.getElementById('again').onclick=()=>startSession(sub);
  foot.innerHTML='';
  // update streak display
  document.getElementById('streakNum').textContent=S.streak;
}

   CLOUD & BACKUP
   - Manual backup: export/import a JSON file (works everywhere, incl. file://).
     A backup file can simply be kept in your Google Drive folder.

const DRIVE_FILE = 'aafi_aara_steps.json';
// Baked-in Google OAuth Client ID (not secret — protected by the Authorized origins list).
// New devices pick this up automatically; you can still change it on the Backup & cloud screen.
const DEFAULT_CLIENT_ID = '732240344163-q96upsoimsmgjaf9dfjhlpf41sagpquk.apps.googleusercontent.com';
const GDRIVE = { token:null, tokenClient:null, fileId:null, syncing:false, timer:null };
function cloudCfg(){ if(!DB.cloud) DB.cloud={clientId:DEFAULT_CLIENT_ID, enabled:false, lastSync:null}; return DB.cloud; }

function cloudStatusLine(){

/* ----- manual backup (no setup, works from file://) ----- */
function cloudExport(){

function cloudImport(file){
  const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result);
    if(d && Array.isArray(d.profiles) && d.profiles.length){
      DB=d; DB.profiles.forEach(p=>{ if(!p.log)p.log=[]; });
      DB.activeId = (DB.activeId && DB.profiles.some(p=>p.id===DB.activeId)) ? DB.activeId : DB.profiles[0].id;
      S=activeProfile(); saveDB();
      alert('Restored progress for '+DB.profiles.length+' learner(s).'); renderHome();
    } else alert('That file does not look like an Aafi & Aara Steps backup.');
  }catch(e){ alert('Sorry — that file could not be read.'); } };
  rd.readAsText(file);
}

/* ----- Google Drive auto-sync ----- */
function driveLoadGis(cb){
  if(window.google && google.accounts && google.accounts.oauth2) return cb();
  const s=document.createElement('script'); s.src='https://accounts.google.com/gsi/client'; s.async=true; s.defer=true;
  s.onload=cb; s.onerror=()=>alert('Could not load Google sign-in — please check your internet connection.');
  document.head.appendChild(s);
}
function driveConnect(){
  const c=cloudCfg();
  if(location.protocol==='file:'){ alert('Google Drive sign-in cannot run from a file:// page (Google blocks it).\n\nOpen the app from a web address first — see the setup steps on this screen — then connect.'); return; }
  if(!c.clientId){ alert('Please paste your Google OAuth Client ID first (see the setup steps).'); return; }
  driveLoadGis(()=>{
    try{
      GDRIVE.tokenClient = google.accounts.oauth2.initTokenClient({
        client_id:c.clientId,
        scope:'https://www.googleapis.com/auth/drive.appdata',
        callback:(resp)=>{ if(resp && resp.access_token){ GDRIVE.token=resp.access_token; c.enabled=true; saveDB(); driveSyncOnConnect(); }
                           else alert('Google sign-in did not return access.'); }
      });
      GDRIVE.tokenClient.requestAccessToken({prompt:''});
    }catch(e){ alert('Could not start Google sign-in: '+e.message); }
  });
}
function driveDisconnect(){ GDRIVE.token=null; cloudCfg().enabled=false; saveDB(); renderCloud(); }

async function driveFindFile(){
  const q=encodeURIComponent("name='"+DRIVE_FILE+"'");
  const r=await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q="+q+"&fields=files(id,modifiedTime)",{headers:{Authorization:'Bearer '+GDRIVE.token}});
  const j=await r.json(); return (j.files && j.files[0]) || null;
}
async function driveUpload(){
  if(!GDRIVE.token || GDRIVE.syncing) return;
  GDRIVE.syncing=true;
  try{
    let f = GDRIVE.fileId ? {id:GDRIVE.fileId} : await driveFindFile();
    const boundary='aas'+Date.now();
    const meta = f ? {} : {name:DRIVE_FILE, parents:['appDataFolder']};
    const multipart =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n`+
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(DB)}\r\n--${boundary}--`;
    const url = f
      ? 'https://www.googleapis.com/upload/drive/v3/files/'+f.id+'?uploadType=multipart'
      : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
    const r=await fetch(url,{method:f?'PATCH':'POST',headers:{Authorization:'Bearer '+GDRIVE.token,'Content-Type':'multipart/related; boundary='+boundary},body:multipart});
    const j=await r.json();
    if(j.id){ GDRIVE.fileId=j.id; cloudCfg().lastSync=new Date().toISOString(); localStorage.setItem(AAS_KEY, JSON.stringify(DB)); }
    else console.warn('Drive upload response:', j);
  }catch(e){ console.warn('Drive upload failed', e); }
  GDRIVE.syncing=false;
  if(document.getElementById('cloudScreen')) renderCloud();
}
async function driveSyncOnConnect(){
  try{
    const f=await driveFindFile();
    if(f){
      const r=await fetch('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media',{headers:{Authorization:'Bearer '+GDRIVE.token}});
      const remote=await r.json(); GDRIVE.fileId=f.id;
      if(remote && Array.isArray(remote.profiles) && remote.profiles.length){
        if(confirm('Google Drive already has saved progress.\n\nOK = load it onto this device.\nCancel = keep this device’s progress and overwrite Drive.')){
          DB=remote; if(!DB.cloud)DB.cloud={}; DB.profiles.forEach(migrateProfile); cloudCfg().enabled=true;
          DB.activeId=(DB.activeId && DB.profiles.some(p=>p.id===DB.activeId))?DB.activeId:DB.profiles[0].id;
          S=activeProfile(); localStorage.setItem(AAS_KEY, JSON.stringify(DB));
        } else { await driveUpload(); }
      } else { await driveUpload(); }
    } else { await driveUpload(); }
  }catch(e){ console.warn(e); }
  // only re-render if the user is still on the cloud screen (don't yank them back)
  if(document.getElementById('cloudScreen')) renderCloud();
}

      <label class="small muted" style="font-weight:700;display:block;margin-top:8px">Your Google OAuth Client ID</label>
      <input class="name" id="cid" placeholder="xxxxxxxx.apps.googleusercontent.com" value="${(c.clientId||DEFAULT_CLIENT_ID).replace(/"/g,'&quot;')}" style="margin:6px 0 12px;font-size:14px">
      <div class="row wrap">
        ${connected
          ? `<button class="btn" id="syncNow">⟳ Sync now</button><button class="btn ghost" id="disc">Disconnect</button>`
          : `<button class="btn" id="conn">Connect Google Drive</button>`}
      </div>
      <details style="margin-top:14px"${onFile?'':' open'}>
        <summary class="small" style="cursor:pointer;font-weight:700;color:var(--brand)">One-time setup steps</summary>
        <ol class="small muted" style="margin:8px 0 0;padding-left:18px;line-height:1.7">
          <li><b>Open the app from a web address, not the file.</b> Double-click <b>“Start Aafi and Aara Steps.bat”</b> in this folder — it opens the app at <b>http://localhost:8000/</b>. (Keep the little server window open while using it.)</li>
          <li>Go to <b>console.cloud.google.com</b> → create a free project.</li>
          <li>APIs &amp; Services → <b>Enable</b> the “Google Drive API”.</li>
          <li>APIs &amp; Services → OAuth consent screen → set it up (External is fine) and add your own Google account as a <b>Test user</b>.</li>
          <li>Credentials → Create <b>OAuth client ID</b> → application type <b>“Web application”</b>.</li>
          <li>Under <b>“Authorised JavaScript origins”</b> add exactly <b>http://localhost:8000</b> (must match the address above).</li>
          <li>Copy the <b>Client ID</b>, paste it in the box above, then click <b>Connect Google Drive</b>.</li>
        </ol>
        <p class="small muted" style="margin:8px 0 0">After this, every worksheet auto-saves to a private folder in your Drive. A sign-in lasts about an hour; just click Connect again next session (your progress is always safe on this device too).</p>
      </details>
    </div>
    </div>`;
  document.getElementById('back').onclick=renderHome;
  document.getElementById('expBtn').onclick=cloudExport;
  document.getElementById('impBtn').onclick=()=>document.getElementById('impFile').click();
  document.getElementById('impFile').onchange=(e)=>{ if(e.target.files[0]) cloudImport(e.target.files[0]); };
  const cid=document.getElementById('cid'); cid.onchange=()=>{ cloudCfg().clientId=cid.value.trim(); saveDB(); };
  const conn=document.getElementById('conn'); if(conn) conn.onclick=()=>{ cloudCfg().clientId=cid.value.trim(); saveDB(); driveConnect(); };
  const disc=document.getElementById('disc'); if(disc) disc.onclick=driveDisconnect;
  const sn=document.getElementById('syncNow'); if(sn) sn.onclick=driveUpload;
  foot.innerHTML='';
}

/* =========================================================================
   GAMES — fun word & picture activities (emoji-based, offline). They award XP
   but stay separate from the mastery ladder. Formats inspired by latihan.my:
   picture match, word builder, sentence builder, guess & spell, memory match.
   ========================================================================= */
const GAME_WORDS = [
  {e:'🍎',w:'apple'},{e:'🍌',w:'banana'},{e:'🐶',w:'dog'},{e:'🐱',w:'cat'},
  {e:'☀️',w:'sun'},{e:'🌙',w:'moon'},{e:'⭐',w:'star'},{e:'🌳',w:'tree'},
  {e:'🐟',w:'fish'},{e:'🐦',w:'bird'},{e:'🚗',w:'car'},{e:'🚌',w:'bus'},
  {e:'📖',w:'book'},{e:'⚽',w:'ball'},{e:'🍰',w:'cake'},{e:'🏠',w:'house'},
  {e:'🌸',w:'flower'},{e:'🔑',w:'key'},{e:'🎩',w:'hat'},{e:'👟',w:'shoe'},
  {e:'⛵',w:'boat'},{e:'🚂',w:'train'},{e:'✈️',w:'plane'},{e:'🐸',w:'frog'},
  {e:'🐻',w:'bear'},{e:'🦁',w:'lion'},{e:'🐘',w:'elephant'},{e:'🐰',w:'rabbit'},
  {e:'🐍',w:'snake'},{e:'🦆',w:'duck'},{e:'🥚',w:'egg'},{e:'🥛',w:'milk'},
  {e:'🍞',w:'bread'},{e:'📱',w:'phone'},{e:'🔔',w:'bell'},{e:'🪁',w:'kite'},
  {e:'🥁',w:'drum'},{e:'🔥',w:'fire'},{e:'🍋',w:'lemon'},{e:'🦋',w:'butterfly'},
];
const GAME_SENTENCES = [
  'The cat sat on the mat.','I like to play games.','We go to school every day.',
  'The sun is very hot today.','She has a big red hat.','Birds can fly high in the sky.',
  'He is my best friend.','We eat our lunch at noon.','The dog ran to the park.',
  'My mum reads me a story.','Please close the door quietly.','The little frog jumped away.',
];
function gameAward(xp){ S.xp += xp; save(); }
function gameHeader(title){ return `<div class="spread" style="margin-bottom:10px"><h1 style="margin:0;font-size:22px">${title}</h1><button class="btn ghost" id="gback">← Games</button></div>`; }
function wireBack(){ const b=document.getElementById('gback'); if(b) b.onclick=renderGames; }
function gameEnd(title, score, total, again){
  gameAward(3);
  app.innerHTML=`<div class="card center">
    <div class="medal">${score>=total?'🏆':score>=total*0.6?'🥈':'💪'}</div>
    <h1 style="margin-bottom:0">${score>=total?'Perfect!':'Well done!'}</h1>
    <p class="muted">${title} · you earned XP ⭐</p>
    <div class="big-num" style="color:var(--reading)">${score} / ${total}</div>
    <div class="row" style="gap:10px;margin-top:14px">
      <button class="btn big" id="pAgain" style="flex:1">Play again</button>
      <button class="btn big ghost" id="pMenu" style="flex:1">Games menu</button>
    </div></div>`;
  document.getElementById('pAgain').onclick=again;
  document.getElementById('pMenu').onclick=renderGames;
}
function renderGames(){
  document.getElementById('homeBtn').classList.remove('hidden');
  const games=[
    ['pic','🖼️','Picture Match','Match the picture to the word'],
    ['word','🔤','Word Builder','Unscramble letters to spell it'],
    ['sent','📝','Sentence Builder','Put the words in order'],
    ['spell','🔡','Guess & Spell','Pick letters to spell the word'],
    ['mem','🧠','Memory Match','Find the picture-word pairs'],
  ];
  app.innerHTML=`<div class="card"><div class="spread"><h1 style="margin:0">🎮 Games</h1></div>
    <p class="muted small" style="margin:6px 0 0">Fun practice — every game earns XP. Tap one to play.</p></div>
    <div class="game-grid">${games.map(g=>`<button class="game-tile" data-g="${g[0]}"><span class="ge">${g[1]}</span><b>${g[2]}</b><span class="small muted">${g[3]}</span></button>`).join('')}</div>`;
  document.querySelectorAll('.game-tile').forEach(b=>b.onclick=()=>startGame(b.dataset.g));
  foot.innerHTML='';
}
function startGame(t){ ({pic:gamePic,word:gameWord,sent:gameSent,spell:gameSpell,mem:gameMem}[t])(); }

/* 1) Picture Match */
function gamePic(){
  let round=0, score=0; const total=8, pool=shuffle(GAME_WORDS);
  (function step(){
    if(round>=total) return gameEnd('🖼️ Picture Match', score, total, gamePic);
    const target=pool[round];
    const opts=shuffle([target, ...shuffle(GAME_WORDS.filter(x=>x.w!==target.w)).slice(0,3)]);
    app.innerHTML=`<div class="card">${gameHeader('🖼️ Picture Match')}
      <div class="game-score">Round ${round+1}/${total} · ⭐ ${score}</div>
      <div class="pic-big">${target.e}</div>
      <p class="center muted">Which word matches the picture?</p>
      <div class="choices">${opts.map(o=>`<button class="choice" data-w="${o.w}">${o.w}</button>`).join('')}</div>
      <div id="gfb" class="feedback"></div></div>`;
    wireBack();
    document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
      const ok=b.dataset.w===target.w;
      document.querySelectorAll('.choice').forEach(x=>{ x.disabled=true; if(x.dataset.w===target.w)x.classList.add('right'); else if(x===b)x.classList.add('wrong'); });
      if(ok){ score++; gameAward(1); }
      const fb=document.getElementById('gfb'); fb.className='feedback show '+(ok?'ok':'no'); fb.innerHTML=ok?'✅ Correct!':`The word is <b>${target.w}</b>`;
      setTimeout(()=>{ round++; step(); }, 850);
    });
  })();
}

/* 2) Word Builder */
function gameWord(){
  let round=0, score=0; const total=8, pool=shuffle(GAME_WORDS.filter(x=>x.w.length>=3 && x.w.length<=7));
  (function step(){
    if(round>=total) return gameEnd('🔤 Word Builder', score, total, gameWord);
    const target=pool[round], word=target.w, letters=shuffle(word.split(''));
    let chosen=[];
    function draw(msg){
      app.innerHTML=`<div class="card">${gameHeader('🔤 Word Builder')}
        <div class="game-score">Round ${round+1}/${total} · ⭐ ${score}</div>
        <div class="pic-big">${target.e}</div>
        <div class="build-line">${word.split('').map((_,i)=>`<span class="blank">${chosen[i]!=null?letters[chosen[i]]:''}</span>`).join('')}</div>
        <div class="tile-row">${letters.map((l,i)=>`<button class="ltile" data-i="${i}" ${chosen.includes(i)?'disabled':''}>${l}</button>`).join('')}</div>
        <div class="row" style="gap:8px;margin-top:12px;justify-content:center"><button class="btn ghost" id="undoL">↶ Undo</button><button class="btn ghost" id="clearL">Clear</button></div>
        <div id="gfb" class="feedback ${msg?'show '+msg.t:''}">${msg?msg.h:''}</div></div>`;
      wireBack();
      document.querySelectorAll('.ltile').forEach(b=>b.onclick=()=>{ chosen.push(+b.dataset.i); if(chosen.length===word.length) check(); else draw(); });
      document.getElementById('undoL').onclick=()=>{ chosen.pop(); draw(); };
      document.getElementById('clearL').onclick=()=>{ chosen=[]; draw(); };
    }
    function check(){
      const built=chosen.map(i=>letters[i]).join('');
      if(built===word){ score++; gameAward(1); draw({t:'ok',h:'✅ '+word.toUpperCase()+'!'}); setTimeout(()=>{ round++; step(); }, 850); }
      else { draw({t:'no',h:'❌ Not quite — try again'}); setTimeout(()=>{ chosen=[]; draw(); }, 850); }
    }
    draw();
  })();
}

/* 3) Sentence Builder */
function gameSent(){
  let round=0, score=0; const total=6, pool=shuffle(GAME_SENTENCES);
  (function step(){
    if(round>=total) return gameEnd('📝 Sentence Builder', score, total, gameSent);
    const sentence=pool[round], words=sentence.replace(/\.$/,'').split(' '), order=shuffle(words.map((w,i)=>i));
    let chosen=[];
    function draw(msg){
      app.innerHTML=`<div class="card">${gameHeader('📝 Sentence Builder')}
        <div class="game-score">Round ${round+1}/${total} · ⭐ ${score}</div>
        <p class="center muted">Tap the words in the right order.</p>
        <div class="sent-line">${chosen.length?chosen.map(i=>`<span class="wchip picked">${words[i]}</span>`).join(''):'<span class="muted small">Your sentence…</span>'}</div>
        <div class="chip-row">${order.map(i=>`<button class="wchip" data-i="${i}" ${chosen.includes(i)?'disabled':''}>${words[i]}</button>`).join('')}</div>
        <div class="row" style="gap:8px;margin-top:12px;justify-content:center"><button class="btn ghost" id="undoW">↶ Undo</button><button class="btn ghost" id="clearW">Clear</button></div>
        <div id="gfb" class="feedback ${msg?'show '+msg.t:''}">${msg?msg.h:''}</div></div>`;
      wireBack();
      document.querySelectorAll('.chip-row .wchip').forEach(b=>b.onclick=()=>{ chosen.push(+b.dataset.i); if(chosen.length===words.length) check(); else draw(); });
      document.getElementById('undoW').onclick=()=>{ chosen.pop(); draw(); };
      document.getElementById('clearW').onclick=()=>{ chosen=[]; draw(); };
    }
    function check(){
      const built=chosen.map(i=>words[i]).join(' ');
      if(built===words.join(' ')){ score++; gameAward(2); draw({t:'ok',h:'✅ '+sentence}); setTimeout(()=>{ round++; step(); }, 1100); }
      else { draw({t:'no',h:'❌ Not quite — try again'}); setTimeout(()=>{ chosen=[]; draw(); }, 1100); }
    }
    draw();
  })();
}

/* 4) Guess & Spell */
function gameSpell(){
  let round=0, score=0; const total=6, pool=shuffle(GAME_WORDS.filter(x=>x.w.length<=8));
  (function step(){
    if(round>=total) return gameEnd('🔡 Guess & Spell', score, total, gameSpell);
    const target=pool[round], word=target.w; let lives=6, guessed=new Set(), scored=false;
    function draw(){
      const won=word.split('').every(c=>guessed.has(c)), lost=lives<=0;
      const display=word.split('').map(c=> guessed.has(c)?c:'_').join(' ');
      app.innerHTML=`<div class="card">${gameHeader('🔡 Guess & Spell')}
        <div class="game-score">Word ${round+1}/${total} · ⭐ ${score} · ${'❤️'.repeat(Math.max(0,lives))}</div>
        <div class="pic-big">${target.e}</div>
        <div class="spell-line">${display}</div>
        <div class="key-pad">${'abcdefghijklmnopqrstuvwxyz'.split('').map(l=>`<button class="key" data-l="${l}" ${guessed.has(l)||won||lost?'disabled':''}>${l}</button>`).join('')}</div>
        <div id="gfb" class="feedback ${won?'show ok':lost?'show no':''}">${won?'✅ '+word.toUpperCase()+'!':lost?'The word was <b>'+word.toUpperCase()+'</b>':''}</div></div>`;
      wireBack();
      document.querySelectorAll('.key').forEach(b=>b.onclick=()=>{
        guessed.add(b.dataset.l); if(!word.includes(b.dataset.l)) lives--;
        const won2=word.split('').every(c=>guessed.has(c)), lost2=lives<=0;
        if(won2 && !scored){ scored=true; score++; gameAward(2); }
        draw();
        if(won2||lost2) setTimeout(()=>{ round++; step(); }, 1200);
      });
    }
    draw();
  })();
}

/* 5) Memory Match */
function gameMem(){
  const pairs=shuffle(GAME_WORDS).slice(0,6);
  let cards=[]; pairs.forEach(p=>{ cards.push({key:p.w,face:p.e,type:'e'}); cards.push({key:p.w,face:p.w,type:'w'}); });
  cards=shuffle(cards).map((c,i)=>({...c,id:i,matched:false}));
  let flipped=[], moves=0, matched=0, lock=false;
  function draw(){
    const done=matched===pairs.length;
    app.innerHTML=`<div class="card">${gameHeader('🧠 Memory Match')}
      <div class="game-score">Moves: ${moves} · Pairs: ${matched}/${pairs.length}</div>
      <div class="mem-grid">${cards.map(c=>{ const show=c.matched||flipped.includes(c.id);
        return `<button class="mem-card ${show?'up':''} ${c.type==='w'?'wcard':''} ${c.matched?'done':''}" data-id="${c.id}" ${c.matched?'disabled':''}>${show?c.face:'❓'}</button>`;
      }).join('')}</div>
      <div id="gfb" class="feedback ${done?'show ok':''}">${done?'🎉 All pairs found in '+moves+' moves!':''}</div>
      ${done?`<div class="row" style="gap:10px;margin-top:14px"><button class="btn big" id="pAgain" style="flex:1">Play again</button><button class="btn big ghost" id="pMenu" style="flex:1">Games menu</button></div>`:''}</div>`;
    wireBack();
    if(done){ document.getElementById('pAgain').onclick=gameMem; document.getElementById('pMenu').onclick=renderGames; return; }
    document.querySelectorAll('.mem-card').forEach(b=>b.onclick=()=>{
      if(lock) return; const id=+b.dataset.id, card=cards.find(c=>c.id===id);
      if(card.matched||flipped.includes(id)) return;
      flipped.push(id);
      if(flipped.length===2){ moves++; lock=true; draw();
        const [a,bb]=flipped.map(fid=>cards.find(c=>c.id===fid));
        if(a.key===bb.key){ setTimeout(()=>{ a.matched=bb.matched=true; matched++; flipped=[]; lock=false; if(matched===pairs.length) gameAward(6); draw(); }, 650); }
        else { setTimeout(()=>{ flipped=[]; lock=false; draw(); }, 900); }
      } else draw();
    });
  }
  draw();
}

/* return to the landing page from anywhere (confirm if mid-worksheet) */
function goHome(){
  const inWorksheet = !!document.querySelector('.qbar');
  if(inWorksheet && !confirm('Leave this worksheet and go home? Your progress on this worksheet won’t be saved.')) return;
  if(S) renderHome(); else renderOnboard();
}
