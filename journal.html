<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Adventure Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#e9e4d8; --paper:#fbf7ee; --ink:#1e1e22; --muted:#6f6a60;
  --red:#e2442f; --blue:#2c6fd1; --yellow:#f6cd3f; --sky:#d6e2f5; --green:#5f9a3a;
  --line:#d9d2c2; --fg:#1e1e22; --fg2:#6f6a60;
  --head:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --hand:"Patrick Hand","Comic Sans MS","Chalkboard SE","Comic Neue",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--desk:#26231e;--fg:#f1ece0;--fg2:#b5ad9c}}
:root[data-theme="dark"]{--desk:#26231e;--fg:#f1ece0;--fg2:#b5ad9c}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--fg);font-family:var(--head);line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 80px}

/* ---------- app chrome ---------- */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font-weight:700;font-size:24px;display:flex;align-items:center;gap:10px}
.brand small{display:block;font-weight:500;font-size:13px;color:var(--fg2)}
.brand .logo{font-size:30px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:14px;padding:9px 14px;font-weight:600;font-size:15px;box-shadow:0 3px 0 var(--ink);transition:transform .05s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.red{background:var(--red);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.yellow{background:var(--yellow)}
.btn.plain{border-color:transparent;box-shadow:none;background:transparent;text-decoration:underline}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:10px;box-shadow:0 2px 0 var(--ink)}
.note{color:var(--ink);background:#fff7d6;border:2px dashed #d9b93a;border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:16px}
.note b{font-weight:600}

/* shelf */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px}
.tile{background:none;border:0;padding:0;text-align:left}
.tile .page{transition:transform .12s}
.tile:hover .page{transform:rotate(-1deg) translateY(-3px)}
.tile .cap{font-size:13px;color:var(--fg2);margin-top:6px;text-align:center}
.addtile{aspect-ratio:148/210;border:3px dashed var(--blue);border-radius:12px;background:rgba(255,255,255,.5);color:var(--blue);font-weight:700;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%}
.addtile span{font-size:44px;line-height:1}
.triphead{grid-column:1/-1;font-weight:700;font-size:18px;margin:6px 0 -8px;display:flex;align-items:center;gap:8px}
.triphead::after{content:"";flex:1;border-top:2px dashed var(--line)}

/* editor */
.edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:24px;align-items:start}
@media(max-width:880px){.edit{grid-template-columns:1fr}}
.form{color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:20px;padding:18px;box-shadow:0 4px 0 var(--ink)}
.form h3{margin:18px 0 8px;font-size:16px;color:var(--blue);display:flex;align-items:center;gap:6px}
.form h3:first-child{margin-top:0}
.form label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:3px}
.form input[type=text],.form input[type=date],.form textarea,.form select{width:100%;border:2px solid var(--line);border-radius:12px;padding:9px 11px;background:#fffdf8;font-size:16px}
.form textarea{font-family:var(--hand);font-size:19px;resize:vertical;min-height:84px}
.form input:focus,.form textarea:focus{outline:3px solid var(--sky);border-color:var(--blue)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:2fr 2fr 1fr;gap:10px}
@media(max-width:520px){.g2,.g3{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:15px;font-weight:500}
.chip.on{border-color:var(--red);background:#fdeae6;box-shadow:0 0 0 2px var(--red) inset}
.chip.ico{padding:4px 9px;font-size:22px}
.moodrow{display:flex;align-items:center;gap:8px;margin-top:6px}
.moodrow b{min-width:64px;font-weight:600;font-size:14px}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.thumb{position:relative;width:86px;height:86px;border-radius:12px;overflow:hidden;border:2px solid var(--ink)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;border:0;background:var(--red);color:#fff;font-weight:700;line-height:1}
.drop{border:3px dashed var(--blue);border-radius:16px;padding:16px;text-align:center;color:var(--blue);font-weight:600;background:#f4f8ff;display:block;cursor:pointer}
.drop.over{background:var(--sky)}
.drop input{display:none}
.item{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.item input[type=checkbox]{width:22px;height:22px;accent-color:var(--red);flex:none}
.item .x{border:0;background:none;color:var(--red);font-size:20px;font-weight:700;flex:none}
.formfoot{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.side{position:sticky;top:12px}
.side .warn{color:var(--ink);margin-top:10px;background:#fdeae6;border:2px solid var(--red);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:500}
.side .tip{font-size:13px;color:var(--fg2);text-align:center;margin-top:8px}
.saved{font-size:13px;color:var(--green);font-weight:600}

/* modal */
.modal{position:fixed;inset:0;background:rgba(30,30,34,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .box{color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:20px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
.modal h2{margin:0 0 12px;font-size:20px}
.modal .row{margin-bottom:12px}
.modal label.ck{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--ink)}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}

/* =====================================================================
   THE PAGE — every size is in cqw so it scales from thumbnail to print
   ===================================================================== */
.page{container-type:inline-size;aspect-ratio:148/210;width:100%;background:var(--paper);border-radius:10px;box-shadow:0 2px 0 #cfc8b7,0 8px 22px rgba(60,50,30,.18);overflow:hidden;position:relative;color:var(--ink)}
.page.white{background:#fff}
.pg{position:absolute;inset:0;padding:6.5cqw 7cqw 7cqw;display:flex;flex-direction:column;gap:2.2cqw;font-family:var(--hand);font-size:4.5cqw;line-height:1.25}
.pg .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:3cqw}
.pg .lbl{font-family:var(--head);font-weight:600;color:var(--red);letter-spacing:.5cqw;font-size:3.7cqw;border-bottom:.6cqw solid var(--red);display:inline-block;padding-right:1.5cqw;border-radius:0 0 1cqw .3cqw;line-height:1.3;text-transform:uppercase}
.pg .date{font-family:var(--head);font-weight:700;font-size:9cqw;line-height:1.05;margin-top:1.2cqw;letter-spacing:-.1cqw;white-space:nowrap}
.pg .city{font-family:var(--head);font-weight:600;color:var(--blue);font-size:5.4cqw;line-height:1.1;margin-top:.6cqw}
.pg .wotd{background:var(--sky);border-radius:4.5cqw 5.5cqw 4cqw 6cqw;padding:2.2cqw 3.2cqw 2.4cqw;text-align:center;flex:none;max-width:35cqw;min-width:27cqw}
.pg .wotd .t{font-family:var(--head);font-weight:600;color:var(--blue);font-size:2.4cqw;letter-spacing:.3cqw;white-space:nowrap}
.pg .wotd .w{font-size:6.6cqw;line-height:1.15;display:flex;justify-content:center;align-items:center;gap:1.5cqw;overflow-wrap:anywhere}
.pg .wotd .m{font-size:3.6cqw;color:#3b3f4a;letter-spacing:.2cqw}
.pg .story{margin:0;font-size:5.4cqw;line-height:1.3;letter-spacing:.25cqw;overflow-wrap:anywhere;white-space:pre-wrap}
.pg mark{background:linear-gradient(transparent 82%,var(--yellow) 82%,var(--yellow) 96%,transparent 96%);color:inherit;padding:0 .4cqw}
.pg .who{font-family:var(--head);font-weight:500;font-size:3cqw;color:var(--muted);margin-top:-1.4cqw}

.pg .media{flex:1 1 0;min-height:20cqw;display:flex;flex-direction:column;gap:2cqw;position:relative}
.pg .photos{flex:1 1 0;min-height:0;display:grid;gap:2cqw;position:relative}
.pg .photos.n2{grid-template-columns:1fr 1fr}
.pg .photos.n3{grid-template-columns:1.5fr 1fr;grid-template-rows:1fr 1fr}
.pg .photos.n3 .ph:first-child{grid-row:1/3}
.pg .photos.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.pg .ph{position:relative;min-height:0;min-width:0;border-radius:3cqw 2.4cqw 3.4cqw 2.6cqw;overflow:hidden;background:#eee6d4}
.pg .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pg .photos.can .ph{cursor:crosshair}
.pg .tape{position:absolute;top:-1.3cqw;left:9cqw;width:15cqw;height:4.2cqw;background:rgba(246,205,63,.8);transform:rotate(-5deg);z-index:2;clip-path:polygon(3% 0,100% 6%,97% 100%,0 92%)}
.pg .tape.b{left:auto;right:8cqw;background:rgba(160,190,235,.85);transform:rotate(4deg)}
.pg .draw{border:.45cqw dashed #7f9fd6;border-radius:4cqw;padding:2cqw 3cqw;color:var(--blue);font-size:4.6cqw;min-height:0;display:flex;justify-content:space-between;align-items:flex-start}

.pg .wm{display:flex;flex-wrap:wrap;align-items:center;gap:.4cqw 3cqw;font-family:var(--head);font-weight:600;font-size:3.3cqw}
.pg .wm .grp{display:flex;align-items:center;gap:1.4cqw}
.pg .wm .sep{width:.3cqw;height:5cqw;background:#9aa0ad;border-radius:1cqw}
.pg .ic{width:6cqw;height:6cqw;position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none}
.pg .ic svg.i{width:4.9cqw;height:4.9cqw}
.pg .ic svg.ring{position:absolute;inset:-.8cqw;width:calc(100% + 1.6cqw);height:calc(100% + 1.6cqw);overflow:visible}

.pg .did{border:.4cqw dashed #7f9fd6;border-radius:4cqw;padding:1.8cqw 3.6cqw 2cqw}
.pg .did h4{margin:0 0 .4cqw;font-family:var(--head);font-weight:700;color:var(--blue);font-size:4cqw;letter-spacing:.2cqw}
.pg .did ul{list-style:none;margin:0;padding:0}
.pg .did li{display:flex;align-items:center;gap:2.4cqw;font-size:4.5cqw;letter-spacing:.2cqw;padding:.3cqw 0;overflow-wrap:anywhere}
.pg .box{width:4.6cqw;height:4.6cqw;border:.4cqw solid #555;border-radius:1cqw;flex:none;position:relative}
.pg .box svg{position:absolute;left:-.3cqw;top:-2cqw;width:6.6cqw;height:6.6cqw;overflow:visible}
.pg .bubble{position:absolute;right:-2.5cqw;bottom:-1.5cqw;z-index:3;box-shadow:0 .4cqw 0 rgba(60,50,30,.18);max-width:40cqw;background:#fff3c4;border-radius:4cqw 4cqw 4cqw 1cqw;padding:2cqw 2.8cqw;font-size:4.1cqw;line-height:1.2;transform:rotate(2deg);overflow-wrap:anywhere}
.pg .bubble b{display:block;font-family:var(--head);font-weight:600;font-size:2.8cqw;color:var(--red);letter-spacing:.2cqw}

.pg .ft{display:flex;align-items:center;gap:4cqw;min-height:17cqw}
.pg .stamp{width:26cqw;flex:none;transform:rotate(-7deg);opacity:.88}
.pg .stamp svg{display:block;width:100%;height:auto;overflow:visible}
.pg .find{flex:1;min-width:0;display:flex;align-items:center;gap:2.5cqw}
.pg .find .tx{flex:1;min-width:0}
.pg .find .tag{display:inline-block;position:relative;font-family:var(--head);font-weight:600;color:var(--blue);font-size:3.9cqw;background:rgba(190,208,240,.75);padding:.4cqw 3cqw .5cqw 3.4cqw;transform:rotate(-3deg);margin-left:4cqw;letter-spacing:.2cqw}
.pg .find .tag::before{content:"";position:absolute;left:-5cqw;top:25%;width:7cqw;height:70%;background:rgba(246,205,63,.85);transform:rotate(-6deg);z-index:-1}
.pg .find p{margin:1.2cqw 0 0;font-size:4.7cqw;line-height:1.2;letter-spacing:.2cqw;overflow-wrap:anywhere}
.pg .find .em{font-size:10cqw;line-height:1;flex:none}
.pg .pn{position:absolute;bottom:2.2cqw;left:0;right:0;text-align:center;font-family:var(--head);font-weight:500;color:#4d5a8a;font-size:3cqw}

/* cover */
.pg.cover{align-items:center;justify-content:center;text-align:center;gap:4cqw}
.cover .ct{font-family:var(--head);font-weight:700;font-size:12cqw;line-height:1.05}
.cover .ct span{background:linear-gradient(transparent 70%,var(--yellow) 70%,var(--yellow) 92%,transparent 92%)}
.cover .cs{font-family:var(--head);font-weight:600;color:var(--blue);font-size:6cqw}
.cover .ce{font-size:13cqw;letter-spacing:2cqw}
.cover .cy{font-family:var(--head);font-weight:600;color:var(--red);font-size:5cqw;border:.6cqw solid var(--red);border-radius:3cqw;padding:1cqw 4cqw;transform:rotate(-4deg)}
.cover .cb{font-size:5cqw;color:var(--muted)}

/* ---------- print ---------- */
#printRoot{display:none}
@media print{
  html,body{background:#fff}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block}
  #printRoot .page{border-radius:0;box-shadow:none;break-after:page;page-break-after:always;break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printRoot.A5 .page{width:148mm;height:210mm}
  #printRoot.A4 .page{width:210mm;height:297mm}
  #printRoot .page:last-child{break-after:auto;page-break-after:auto}
}
</style>
<style id="pageSize">@page{size:A5;margin:0}</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
  </filter>
  <filter id="roughS" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".12" numOctaves="2" seed="9" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1"/>
  </filter>
</svg>

<div class="wrap">
  <div class="bar">
    <div class="brand"><span class="logo">📔</span><div><span id="bookTitle">Our Adventure Journal</span><small id="bookSub"></small></div></div>
    <div class="tools" id="shelfTools">
      <button class="btn red" data-act="new">＋ New page</button>
      <button class="btn yellow" data-act="print">🖨 Print book</button>
      <button class="btn" data-act="backup">💾 Backup</button>
      <button class="btn" data-act="settings">⚙ Settings</button>
    </div>
  </div>

  <div id="backupNote" class="note hidden"></div>

  <div id="shelfView"><div class="shelf" id="shelf"></div></div>

  <div id="editView" class="hidden">
    <div class="edit">
      <div class="form" id="form"></div>
      <div class="side">
        <div id="preview"></div>
        <div id="overflowWarn" class="warn hidden">✂️ This page is too full — the bottom is being cut off. Shorten the story or remove a list item.</div>
        <div class="tip">Tap a photo on the page to choose which part stays in view.</div>
      </div>
    </div>
  </div>
</div>

<div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
<div id="printRoot"></div>

<script>
(() => {
'use strict';

/* ============================== storage ============================== */
const DB_NAME = 'adventure-journal', STORE = 'entries';
let dbp;
function db(){
  return dbp ||= new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, {keyPath:'id'});
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function tx(mode, fn){
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(STORE, mode), out = fn(t.objectStore(STORE));
    t.oncomplete = () => res(out && 'result' in out ? out.result : undefined);
    t.onerror = t.onabort = () => rej(t.error);
  });
}
const dbAll = () => tx('readonly', s => s.getAll());
const dbPut = e => tx('readwrite', s => s.put(e));
const dbDel = id => tx('readwrite', s => s.delete(id));

const SET_KEY = 'adventure-journal-settings';
let settings = {title:'Our Adventure Journal', kids:['Aafi','Aara'], lastBackup:0, changesSinceBackup:0};
try { Object.assign(settings, JSON.parse(localStorage.getItem(SET_KEY) || '{}')); } catch(e){}
const saveSettings = () => { try { localStorage.setItem(SET_KEY, JSON.stringify(settings)); } catch(e){} };

/* ============================== helpers ============================== */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pDate = s => { const [y,m,d] = (s||'').split('-').map(Number); return y ? new Date(y, m-1, d) : null; };
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fmtDate = s => { const d = pDate(s); return d ? `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}` : 'Someday'; };
const fmtStamp = s => { const d = pDate(s); return d ? `${d.getDate()} ${MONTHS[d.getMonth()].toUpperCase()} ${d.getFullYear()}` : ''; };

const FIND_EMOJI = ['🍁','🐚','🌸','🪨','🍂','🦋','🐞','🌼','🪶','🐌','⭐','🍓','🦀','🐸','🌈','🍄','🐟','🐿️','🪁','🎟️','🍦','🧸','🚂','🦖'];
const WORD_EMOJI = ['','🎋','🚃','🌳','🌊','🏝️','🐒','🐘','🦁','🍜','🍚','⛰️','🏰','🕌','🚌','✈️','⛵','🌙','☀️','🌧️','🐱','🌺','🍉','⚽'];

/* ============================== icons ============================== */
const I = {
  sun:'<circle cx="12" cy="12" r="3.6"/><path d="M12 3.2v2.4M12 18.4v2.4M3.2 12h2.4M18.4 12h2.4M5.8 5.8l1.7 1.7M16.5 16.5l1.7 1.7M5.8 18.2l1.7-1.7M16.5 7.5l1.7-1.7"/>',
  cloud:'<path d="M7 18.5a4 4 0 0 1-.6-7.95A5.5 5.5 0 0 1 17 9.6a4.4 4.4 0 0 1 .6 8.9z"/>',
  rain:'<path d="M7 15a3.6 3.6 0 0 1-.5-7.15A5 5 0 0 1 16.2 7a4 4 0 0 1 .8 7.95z"/><path d="M8.5 18l-.9 2.6M12.5 18l-.9 2.6M16.5 18l-.9 2.6" stroke="#2c6fd1"/>',
  snow:'<path d="M12 3.5v17M4.6 7.75l14.8 8.5M19.4 7.75l-14.8 8.5M12 6.5l-2-1.8M12 6.5l2-1.8M12 17.5l-2 1.8M12 17.5l2 1.8"/>',
  happy:'<circle cx="12" cy="12" r="8.6"/><path d="M9 9.6v1.2M15 9.6v1.2M8.2 13.8c1.9 2.7 5.7 2.7 7.6 0"/>',
  ok:'<circle cx="12" cy="12" r="8.6"/><path d="M9 9.6v1.2M15 9.6v1.2M8.6 15h6.8"/>',
  sad:'<circle cx="12" cy="12" r="8.6"/><path d="M9 9.6v1.2M15 9.6v1.2M8.2 16.2c1.9-2.6 5.7-2.6 7.6 0"/>'
};

  if (/\*[^*\n]+\*/.test(h)) return h.replace(/\*([^*\n]+)\*/g, '<mark>$1</mark>');
  const key = esc((e.spot || '').trim());
  if (key){
    const i = h.toLowerCase().indexOf(key.toLowerCase());
    if (i >= 0) h = h.slice(0, i) + '<mark>' + h.slice(i, i + key.length) + '</mark>' + h.slice(i + key.length);

}

/* photos: shrink to print-friendly size before storing */
async function shrink(file){
  let src;
  try { src = await createImageBitmap(file, {imageOrientation:'from-image'}); }
  catch(e){
    src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('unreadable image')); im.src = URL.createObjectURL(file); });
  }
  const MAX = 1800, k = Math.min(1, MAX / Math.max(src.width, src.height));
  const c = document.createElement('canvas'); c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .86);
}
async function addFiles(files){
  const failed = [];
  for (const f of [...files]){
    if (cur.photos.length >= 4) break;
    if (!f.type.startsWith('image/') && !/\.(heic|heif)$/i.test(f.name)) continue;
    try { cur.photos.push({src: await shrink(f), fx:50, fy:50}); } catch(e){ failed.push(f.name); }
  }
  if (failed.length) alert('Could not read: ' + failed.join(', ') + '\nTry a JPG or PNG version of the photo.');
  renderThumbs(); changed();
}

    p.fx = Math.round((ev.clientX - r.left) / r.width * 100); p.fy = Math.round((ev.clientY - r.top) / r.height * 100);

    const i = cur.who.indexOf(d.who); i >= 0 ? cur.who.splice(i, 1) : cur.who.push(d.who);
    cur.who.sort((a, b) => settings.kids.indexOf(a) - settings.kids.indexOf(b));
    t.classList.toggle('on'); renderMoods(); return changed();
  }
  if (d.mood){ cur.moods[d.kid] = cur.moods[d.kid] === d.mood ? '' : d.mood; renderMoods(); return changed(); }
  const pick = (attr, set, root) => { set(d[attr]); root.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === t && c.dataset[attr] === get())); };
  let get;
  if (d.weather){ get = () => cur.weather; pick('weather', v => cur.weather = cur.weather === v ? '' : v, $('#weather')); return changed(); }
  if (d.find !== undefined){ get = () => cur.find.emoji; pick('find', v => cur.find.emoji = cur.find.emoji === v ? '' : v, $('#findEmoji')); return changed(); }
  if (d.word !== undefined){ get = () => cur.word.emoji; pick('word', v => cur.word.emoji = v, $('#wordEmoji')); return changed(); }
  if (d.didx !== undefined){ cur.did.splice(+d.didx, 1); renderDid(); return changed(); }
  if (t.id === 'addDid'){ cur.did.push({t:'', done:true}); renderDid(); const ins = document.querySelectorAll('[data-didt]'); ins[ins.length-1].focus(); return; }
  if (t.id === 'doneBtn'){ if (saveT || curIsNew && isWorthSaving()) await persist(); cur = null; renderShelf(); return show('shelf'); }
  if (t.id === 'printOne'){ if (saveT) await persist(); return doPrint([cur], {size:'A5', cover:false, white:false}); }
  if (t.id === 'delBtn'){

    await dbDel(cur.id); entries = entries.filter(x => x.id !== cur.id);
    settings.changesSinceBackup++; saveSettings();

  }
});

  const trips = [...new Set(entries.map(x => x.trip).filter(Boolean))];
  const b = modal(`<h2>🖨 Print the book</h2>
    <div class="row"><label>Which pages</label><select id="pWhich" style="width:100%;padding:8px;border-radius:10px;border:2px solid var(--line)"><option value="">Everything (${entries.length} pages)</option>${trips.map(t => `<option value="${esc(t)}">Only: ${esc(t)}</option>`).join('')}</select></div>
    <div class="row"><label>Paper size</label><select id="pSize" style="width:100%;padding:8px;border-radius:10px;border:2px solid var(--line)"><option value="A5">A5 — small book (best fit)</option><option value="A4">A4 — big pages</option></select></div>
    <div class="row"><label class="ck"><input type="checkbox" id="pCover" checked> Include a cover page</label></div>
    <div class="row"><label class="ck"><input type="checkbox" id="pWhite"> White background (saves ink; use if printing on cream paper)</label></div>
    <div class="hint">In the print window choose <b>Save as PDF</b> to keep a file for a print shop. Set margins to “None” and turn on “Background graphics”.</div>
    <div class="acts"><button class="btn" data-close>Cancel</button><button class="btn red" id="pGo">Print</button></div>`);
  $('#pGo', b).onclick = () => {
    const w = $('#pWhich', b).value, list = sorted().filter(e => !w || e.trip === w);
    const o = {size:$('#pSize', b).value, cover:$('#pCover', b).checked, white:$('#pWhite', b).checked};
    closeModal(); doPrint(list, o);
  };
}
async function doPrint(list, o){
  const all = sorted(), root = $('#printRoot');
  root.className = o.size;
  $('#pageSize').textContent = `@page{size:${o.size};margin:0}`;
  root.innerHTML = (o.cover ? coverHTML(list, o.white) : '') + list.map(e => pageHTML(e, {...ctxFor(e, all), white:o.white})).join('');
  await Promise.all([...root.querySelectorAll('img')].map(i => i.decode ? i.decode().catch(() => {}) : 0));
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  window.print();
}

function backupDialog(){
  const last = settings.lastBackup ? new Date(settings.lastBackup).toLocaleDateString() : 'never';
  const b = modal(`<h2>💾 Backup</h2>
    <p style="font-size:14px;margin:0 0 12px">Everything is stored <b>only in this browser on this device</b>. A backup file is the only copy that survives a lost phone, a new laptop, or cleared browser data. Keep it somewhere safe (cloud drive, email to yourself).</p>
    <p style="font-size:14px;margin:0 0 12px">Last backup: <b>${last}</b></p>
    <div class="row"><button class="btn blue" id="bExp" style="width:100%">⬇ Download backup file</button></div>
    <div class="row"><label class="btn" style="display:block;text-align:center">⬆ Restore from a backup file<input type="file" id="bImp" accept=".json,application/json" style="display:none"></label></div>
    <div class="hint">Restoring adds the pages from the file. Pages you already have are kept; if the same page is in both, the newer copy from the file replaces it only if you confirm.</div>
    <div class="acts"><button class="btn" data-close>Close</button></div>`);
  $('#bExp', b).onclick = () => { exportBackup(); closeModal(); };
  $('#bImp', b).onchange = async ev => {
    const f = ev.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data || data.app !== 'adventure-journal' || !Array.isArray(data.entries)) throw new Error('This is not an Adventure Journal backup file.');
      const have = new Set(entries.map(e => e.id));
      const dup = data.entries.filter(e => have.has(e.id)).length;
      const overwrite = dup ? confirm(`${dup} page(s) in this file already exist here.\n\nOK = replace them with the copies from the file.\nCancel = keep the ones here and only add the new pages.`) : false;
      let n = 0;
      for (const e of data.entries){
        if (!e || !e.id) continue;
        if (have.has(e.id) && !overwrite) continue;
        await dbPut(e); n++;
      }
      entries = await dbAll();
      if (!localStorage.getItem(SET_KEY) && data.settings){ settings.title = data.settings.title || settings.title; settings.kids = data.settings.kids || settings.kids; saveSettings(); }
      closeModal(); renderShelf(); alert(`Restored ${n} page(s).`);
    } catch (err){ alert('Could not restore: ' + err.message); }
  };
}
function exportBackup(){
  const blob = new Blob([JSON.stringify({app:'adventure-journal', version:1, exported:new Date().toISOString(), settings:{title:settings.title, kids:settings.kids}, entries})], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `adventure-journal-backup-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  settings.lastBackup = Date.now(); settings.changesSinceBackup = 0; saveSettings(); renderShelf();
}

function settingsDialog(){
  const b = modal(`<h2>⚙ Settings</h2>
    <div class="row"><label>Book title</label><input type="text" id="sTitle" maxlength="30" value="${esc(settings.title)}" style="width:100%;padding:8px;border-radius:10px;border:2px solid var(--line)"></div>
    <div class="row"><label>Children's names (comma separated)</label><input type="text" id="sKids" maxlength="60" value="${esc(settings.kids.join(', '))}" style="width:100%;padding:8px;border-radius:10px;border:2px solid var(--line)"></div>
    <div class="hint">Up to 3 names fit nicely on a page.</div>
    <div class="acts"><button class="btn" data-close>Cancel</button><button class="btn blue" id="sGo">Save</button></div>`);
  $('#sGo', b).onclick = () => {
    settings.title = $('#sTitle', b).value.trim() || 'Our Adventure Journal';
    const kids = $('#sKids', b).value.split(',').map(s => s.trim().slice(0, 12)).filter(Boolean).slice(0, 4);
    if (kids.length) settings.kids = kids;
    saveSettings(); closeModal(); renderShelf();
  };
}

/* ============================== boot ============================== */
(async () => {
  try { entries = await dbAll(); }
  catch (e){ $('#backupNote').classList.remove('hidden'); $('#backupNote').textContent = 'This browser is blocking storage (private window?). Pages cannot be saved here.'; }
  renderShelf();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
})();
</script>
